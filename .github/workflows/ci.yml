name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check server/server.js
      - name: Boot test (server + static + API)
        run: node scripts/ci-boot-test.mjs
