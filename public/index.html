// 왕복(가서 캐고 → 지고 와서 납품) 한 사이클이 너무 길면 도구 이벤트가 계속 밀린다 — 조금 빠르게.
const WALK_SPEED = 6.0; // units/sec
const WORKER_SEP = 1.9; // 워커끼리 최소 간격(사령관 "애들끼리 겹치면 안 됨")

// ══════ §4 이동 — 스티어링 하나로 통일 (`_설계_워커시스템.md` §4) ══════
// 24~32차의 "직선 이동 + 반경 밀어내기 + 접선 회피"는 서로 따로 붙어 싸웠다(벽붙음→뱅글뱅글).
// 여기서는 매 프레임 이동 벡터를 **목표방향 + 장애물회피(웨이포인트) + 워커분리** 한 식으로 합친다.
// 회피는 원 둘레를 따라 도는 게 아니라 **옆으로 비껴가는 웨이포인트를 한 번 잡고 지나면 버린다** —
// 원 궤도에 갇히는 것 자체가 구조적으로 불가능해진다.
const AVOID_MARGIN = 1.2;   // 건물 원 바깥으로 이만큼 더 벌려서 지나간다
const WAYPOINT_HIT = 1.8;   // 웨이포인트를 지났다고 볼 거리

// 선분 P→G가 원(C,r)을 지나는가 — 선분 위 최근접점까지의 거리로 판정
function segHitsCircle(px, pz, gx, gz, cx, cz, r){
  const vx = gx - px, vz = gz - pz;
  const vv = vx*vx + vz*vz;
  if (vv < 1e-6) return Math.hypot(cx-px, cz-pz) < r;
  let t = ((cx-px)*vx + (cz-pz)*vz) / vv;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(cx - (px + vx*t), cz - (pz + vz*t)) < r;
}
// 경로가 건설 현장을 지나면 우회점을 한 번 계산한다.
// ★우회점을 "원 위의 옆점"으로 잡았더니 **현재 위치에서 그 점까지의 직선이 원을 관통**할 수 있었다
//   (원 위의 점을 향하는 직선은 접선이 아니다) → 밀려나고 다시 향하기를 반복하며 벽에 붙는다.
//   그래서 **현재 위치에서 원에 그은 접선의 접점**을 쓴다 — 접점까지의 직선은 정의상 원을 지나지 않는다.
function planDetour(w, gx, gz){
  const px = w.group.position.x, pz = w.group.position.z;
  // 경로가 지나는 장애물 중 **가장 먼저 마주치는(가까운) 것**을 기준으로 우회한다.
  let hit = null, hitDist = Infinity;
  for (const o of OBSTACLES){
    const R = o.r + AVOID_MARGIN;
    if (Math.hypot(gx - o.x, gz - o.z) <= R + 0.01) continue;      // 목적지가 그 건물 = 우회 불필요
    if (!segHitsCircle(px, pz, gx, gz, o.x, o.z, R)) continue;
    const d = Math.hypot(o.x - px, o.z - pz);
    if (d < hitDist){ hitDist = d; hit = { o, R }; }
  }
  if (!hit) return null;
  const buildSitePos = hit.o, R = hit.R;   // 아래 로직은 이 하나의 원을 기준으로 돈다
  const cost = p => Math.hypot(p.x-px, p.z-pz) + Math.hypot(gx-p.x, gz-p.z);
  const pick = (a, b) => cost(a) <= cost(b) ? a : b;

  // ① 기본: 진행 방향의 **측면 통과점**(중심에서 목표 방향에 수직으로 R만큼) — 원을 넓게 비껴간다.
  //    실측으로 이쪽이 접점보다 훨씬 여유 있게 지나간다(최소 건물거리 6.34 vs 5.65).
  const dx = gx - px, dz = gz - pz, L = Math.hypot(dx, dz) || 1;
  const nx = -dz/L, nz = dx/L;
  const side = pick({ x: buildSitePos.x + nx*R, z: buildSitePos.z + nz*R },
                    { x: buildSitePos.x - nx*R, z: buildSitePos.z - nz*R });
  if (!segHitsCircle(px, pz, side.x, side.z, buildSitePos.x, buildSitePos.z, buildSiteRadius)) return side;

  // ② 측면 통과점으로 가는 길 자체가 건물을 파고들면(원에 바짝 붙어 있을 때) 접점으로 폴백한다 —
  //    접점까지의 직선은 정의상 원을 관통하지 않는다.
  const vx = px - buildSitePos.x, vz = pz - buildSitePos.z;
  const d = Math.hypot(vx, vz);
  if (d <= R) return null; // 원 안 — 안전망(keepOutOfBuilding)이 먼저 밖으로 밀어낸다
  const base = Math.atan2(vz, vx);
  const spread = Math.acos(Math.min(1, R/d));
  const pt = a => ({ x: buildSitePos.x + Math.cos(a)*R, z: buildSitePos.z + Math.sin(a)*R });
  return pick(pt(base + spread), pt(base - spread));
}
// ★사령관 지적(2026-08-11) "건물들을 뚫고 지나가고 있고" — 충돌이 **건설현장 한 채**에만 걸려 있었다.
//   대장간·제재소·시장이 생기면서 나머지는 그냥 통과했다. 장애물을 목록으로 일반화한다.
const OBSTACLES = []; // {x, z, r} — 건설현장 + 작업장 건물
function addObstacle(x, z, r){ OBSTACLES.push({ x, z, r }); }
// 건물 안으로 파고든 좌표를 원 밖으로 되돌린다(이동·정지 양쪽에서 같은 규칙을 쓴다).
function keepOutOfBuilding(p){
  for (const o of OBSTACLES){
    const dx = p.x - o.x, dz = p.z - o.z;
    const d = Math.hypot(dx, dz);
    if (d < o.r && d > 0.001){ p.x = o.x + (dx/d) * o.r; p.z = o.z + (dz/d) * o.r; }
  }
}
// 서 있는 동안의 겹침 해소 — 이동 중에는 스티어링(③)이 처리하지만, 납품 지점처럼 여러 명이 같은 자리로
// 몰리는 곳에서는 도착한 뒤 그대로 포개진다(사령관 "애들끼리 겹치면 안 됨"). 정지 상태에서도 서서히 벌린다.
function resolveOverlap(w, dt){
  const p = w.group.position;
  let px = 0, pz = 0;
  for (const o of workers.values()){
    if (o === w || !o.group) continue;
    let sx = p.x - o.group.position.x, sz = p.z - o.group.position.z;
    let sd = Math.hypot(sx, sz);
    if (sd >= WORKER_SEP) continue;
    if (sd < 0.001){ // 완전히 포개진 경우 — 결정적인 방향으로 뗀다(새로고침해도 같은 결과)
      const a = (w.jobId.charCodeAt(0) % 16) / 16 * Math.PI*2;
      sx = Math.cos(a); sz = Math.sin(a); sd = 1;
    }
    const k = (WORKER_SEP - sd) / sd;
    px += sx*k; pz += sz*k;
  }
  // ★2026-08-13 실측 — 건물 밖으로 밀어내는 안전망이 아래 조기 반환 뒤에 있어서, **다른 워커와 겹쳤을 때만**
  //   돌았다. 혼자 서 있는 워커는 건물 안에 들어가 있어도 영원히 나오지 않는다(시장 크기를 줄이며 건물이
  //   안쪽으로 옮겨지자 대기 중이던 워커가 0.82m 파묻힌 채 고정). 서 있는 동안에는 겹침과 무관하게 늘 건다.
  keepOutOfBuilding(p);
  if (px === 0 && pz === 0) return;
  const g = Math.min(1, dt*4) * 0.5; // 튀지 않게 서서히
  p.x += px*g; p.z += pz*g;
  keepOutOfBuilding(p);
}
// 한 프레임 이동. 목표 반경 + 1.3 안에 들어오면 true(도착) — 대상 종류(광물/나무/건물)와 무관한 동일 규칙.
function steerWorker(w, dt){
  const p = w.group.position;
  const tx = w.target.x, tz = w.target.z;
  let stopAt = Math.max(0.3, (w.target.r || 0) + 1.3);
  // ★사령관 지적(2026-08-11) "벽에 아직도 박고 있는 애가 있음" — 실측: 목표가 건물 중심(NODES.build)인데
  //   도착 판정이 1.3이었다. 건물 반경(5.65)이 목표에 안 붙은 것(건물 GLB가 로드되기 전에 배정되면
  //   pickNode가 r을 못 붙인다)이 원인. 벽이 5.65에서 막는데 1.3까지 가야 도착이라 **영원히 도달 불가**,
  //   그래서 벽을 계속 밀고 있었다. 목표가 건물 안이면 **벽 앞이 곧 도착**이 되도록 매 프레임 보정한다.
  for (const o of OBSTACLES){
    const dT = Math.hypot(tx - o.x, tz - o.z);
    if (dT < o.r) stopAt = Math.max(stopAt, o.r - dT + 1.3);
  }
  const distGoal = Math.hypot(tx - p.x, tz - p.z);
  if (distGoal <= stopAt){ w.waypoint = null; w._stuckSince = 0; w._flips = 0; w._lastDist = null; return true; }

  // 진전 감시 — 어떤 이유로든 목표까지의 거리가 줄지 않으면 벽에 붙은 것이다.
  // 위 두 수정으로 원인은 없앴지만, 같은 증상이 다른 경로로 재발하지 않게 안전망을 둔다.
  if (w._lastDist == null || distGoal < w._lastDist - 0.25){ w._lastDist = distGoal; w._stuckSince = 0; }
  else if (!w._stuckSince) w._stuckSince = nowMs();

  // ① 웨이포인트 — 지났으면 버리고, 없으면 경로가 건물을 가로지를 때만 새로 잡는다
  if (w.waypoint && Math.hypot(w.waypoint.x - p.x, w.waypoint.z - p.z) < WAYPOINT_HIT) w.waypoint = null;
  // 2.5초 넘게 진전이 없으면 우회 방향을 반대로 뒤집어 본다(한쪽이 막혔다는 뜻)
  if (w._stuckSince && nowMs() - w._stuckSince > 2500 && buildSitePos){
    w.waypoint = w.waypoint
      ? { x: 2*buildSitePos.x - w.waypoint.x, z: 2*buildSitePos.z - w.waypoint.z }
      : planDetour(w, tx, tz);
    w._stuckSince = nowMs();
    w._flips = (w._flips || 0) + 1;
    // 양쪽 다 막혔다면 이 목표는 포기한다(다른 자리로 재배정 / 그 자리에서 납품) — 멈춰 서 있는 것보다 낫다
    if (w._flips >= 2) w._giveUp = true;
  }
  if (!w.waypoint) w.waypoint = planDetour(w, tx, tz);
  const gx = w.waypoint ? w.waypoint.x : tx;
  const gz = w.waypoint ? w.waypoint.z : tz;

  // ② 목표방향
  let vx = gx - p.x, vz = gz - p.z;
  const gl = Math.hypot(vx, vz) || 1;
  vx /= gl; vz /= gl;
  // ③ 워커분리 — 가까울수록 세게 밀어낸다(위치를 직접 옮기지 않고 이동 벡터에 섞는다)
  for (const o of workers.values()){
    if (o === w || !o.group) continue;
    const sx = p.x - o.group.position.x, sz = p.z - o.group.position.z;
    const sd = Math.hypot(sx, sz);
    if (sd < WORKER_SEP && sd > 0.001){
      const k = ((WORKER_SEP - sd) / WORKER_SEP) * 1.4;
      vx += (sx/sd) * k; vz += (sz/sd) * k;
    }
  }
  const ml = Math.hypot(vx, vz) || 1;
  const step = Math.min(WALK_SPEED*dt, Math.max(0.02, (w.waypoint ? gl : distGoal - stopAt)));
  const mx = (vx/ml) * step, mz = (vz/ml) * step;
  p.x += mx; p.z += mz;

  // ④ 마지막 안전망 — 그래도 건물 안으로 파고들면 밖으로 밀어낸다(설계상 여기 걸릴 일은 거의 없다)
  keepOutOfBuilding(p);

  // 실제로 움직인 방향을 본다(회피 중엔 목표가 아니라 비껴가는 쪽을 봐야 자연스럽다)
  const yaw = Math.atan2(mx, mz);
  let d = yaw - w.group.rotation.y;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  w.group.rotation.y += d * Math.min(1, dt*8);
  // 짐을 지고 돌아올 땐 다른 걸음(Walking_B)으로 — 캐러 갈 때와 해올 때가 한눈에 구분된다.
  ensureLoopAction(w, w.carrying ? 'Walking_B' : 'Walking_A');
  return false;
}
// 대상을 정면으로 보게 회전만 맞춘다(위치 스냅은 하지 않는다 — 그게 "돌 속으로 들어가는" 원인이었다).
function faceTarget(w){
  if (!w.target) return;
  // 건물 작업장은 목적지(서는 자리)가 아니라 `face`(모루/건물)를 바라봐야 두드리는 그림이 맞는다.
  const f = w.target.face || w.target;
  w.group.rotation.y = Math.atan2(f.x - w.group.position.x, f.z - w.group.position.z);
}

// ══════ §3 워커 상태 머신 — 단일 정의 (`_설계_워커시스템.md` §3) ══════
// IDLE ─(작업 배정)→ TRAVEL ─(도착)→ WORK ─(대상 파괴)→ HAUL ─(건물 도착)→ DELIVER ─→ IDLE
// 32차까지는 이 규칙이 animate 루프의 else-if 사슬에 흩어져 있어 한 곳을 고치면 옆이 깨졌다.
// 상태 전이는 전부 이 함수 안에서만 일어난다.
function tickWorker(w, now, dt){
  const st = w.state || 'IDLE';
  tickChat(w, now);
  // 이동 중(TRAVEL/HAUL)에는 스티어링이 분리를 이미 섞어 처리한다 — 서 있는 상태만 따로 벌려준다.
  if (st !== 'TRAVEL' && st !== 'HAUL') resolveOverlap(w, dt);
  switch (st){

    case 'TRAVEL': {
      if (!w.target){ finishCycle(w); break; }
      if (!steerWorker(w, dt)){
        // 양쪽 우회가 다 막혀 포기한 경우 — 다른 자리로 다시 보낸다(제자리에 굳어 있지 않게)
        if (w._giveUp){
          w._giveUp = false; w._flips = 0; w._stuckSince = 0; w._lastDist = null;
          const cat = w.pendingCategory;
          const next = (cat === 'ore' || cat === 'forage') ? pickNode(cat) : null;
          if (next && !next.broken){ w.target = next; w.waypoint = null; }
          else finishCycle(w);
        }
        break;
      }
      faceTarget(w);
      // 걸어오는 사이 다른 워커가 먼저 캐버린 대상 — 허공을 찍지 말고 다른 자리로 재배정한다
      if (w.carryAfter && w.target.broken){
        const cat = w.pendingCategory === 'forage' ? 'forage' : 'ore';
        const next = pickNode(cat);
        if (next && !next.broken){
          w.target = next; w.waypoint = null;
          w.workClip = animForCategory(cat); w.workHold = 2600;
        } else finishCycle(w);
        break;
      }
      playCategory(w, w.workClip, w.workHold);
      // 노드 도착 = 캐내는 시점 — "+1 자원명" 팝업으로 뭘 얻었는지 보여준다
      spawnYieldPopup(w.group.position.x, w.group.position.y + 3.2, w.group.position.z, disp(w.resourceLabel || '작업'), w.resourceColor);
      sayChat(w, w.pendingCategory);   // 작업 시작 — 그 자리에 맞는 한마디
      if (w.carryAfter){
        w.state = 'WORK';
        w._nextSwingAt = now + 420; // 스윙 타이밍 — 곡괭이/도끼가 실제로 대상을 깎는 리듬
      } else if (w.craftAfter){
        w.state = 'WORK';           // 대장간·제재소·시장·건설현장 — 그 자리에서 계속 작업
        w._nextSwingAt = 0;         // 깎을 대상이 없으니 스윙(CSG)은 없다
      } else {
        finishCycle(w); // 보고(base)는 도착 동작으로 끝난다
      }
      break;
    }

    case 'WORK': {
      // 스윙 주기마다 실제로 대상을 깎는다(CSG). 작업 유지시간(2.6초) 안에 파괴 임계치(광물 8·나무 5)에
      // 도달하도록 간격을 역산해둔다 — 예전 480ms로는 5회에 그쳐 광물이 절대 안 부서졌다.
      if (now <= w.holdUntil){
        if (w.target && w._nextSwingAt && now >= w._nextSwingAt){
          w._nextSwingAt = now + (w.pendingCategory === 'forage' ? 460 : 290);
          const node = w.target;
          const gy = groundAt(node.x, node.z) ?? w.group.position.y;
          const hit = new THREE.Vector3(node.x, gy + Math.max(0.5, (node.r||1) * 0.8), node.z);
          if (!node.broken){
            if (w.pendingCategory === 'forage') chopNode(node, hit, w.group.position);
            else carveNode(node, hit, new THREE.Vector3(node.x - w.group.position.x, 0, node.z - w.group.position.z).normalize());
          }
          // 부서지는 순간이 곧 채집 완료 — 남은 시간 동안 허공을 찍지 않는다
          if (node.broken) w.holdUntil = now;
        }
        break;
      }
      // 건물 작업(제작형)은 운반이 없다 — 그 자리에서 결과물 팝업을 띄우고 한 사이클을 마친다.
      if (w.craftAfter){
        spawnYieldPopup(w.group.position.x, w.group.position.y + 3.2, w.group.position.z,
          disp(w.resourceLabel || '작업'), w.resourceColor);
        w.craftAfter = false;
        finishCycle(w);
        break;
      }
      if (!buildSitePos){ finishCycle(w); break; }
      // 캐는 동작이 끝났다 → 자원을 지고 건설 현장으로 되돌아간다(사령관 요청의 "해오는" 구간)
      equipTool(w, null);   // 연장을 내리고 손에 자원을 든다
      setCarrying(w, true);
      w.carryAfter = false;
      w.target = { x: buildSitePos.x, z: buildSitePos.z, r: buildSiteRadius };
      w.waypoint = null;
      w.state = 'HAUL';
      sayChat(w, 'haul');   // "아이고~ 힘들어라" — 짐 지고 돌아가는 구간
      break;
    }

    case 'HAUL': {
      if (!w.target){ finishCycle(w); break; }
      if (!steerWorker(w, dt)){
        // 건물 앞까지 못 갔는데 양쪽이 다 막혔다면 그 자리에서 내려놓는다(짐을 진 채 굳어 있지 않게)
        if (!w._giveUp) break;
        w._giveUp = false; w._flips = 0; w._stuckSince = 0; w._lastDist = null;
      }
      faceTarget(w);
      playCategory(w, 'PickUp', 1100); // 도착해서 내려놓는 동작
      setCarrying(w, false);
      deliveredCount++; // ★건물 진행률의 유일한 입력 — 실제로 캐 와서 내려놓은 횟수
      spawnYieldPopup(w.group.position.x, w.group.position.y + 3.2, w.group.position.z,
        KO ? (w.resourceLabel||'자원') + ' 납품 ' + deliveredCount + '/' + DELIVERIES_PER_BUILDING
           : disp(w.resourceLabel||'자원') + ' delivered ' + deliveredCount + '/' + DELIVERIES_PER_BUILDING, w.resourceColor);
      w.state = 'DELIVER';
      sayChat(w, 'deliver');
      break;
    }

    case 'DELIVER': {
      if (now > w.holdUntil) finishCycle(w); // 내려놓는 동작이 끝나면 한 사이클 종료
      break;
    }

    default: { // IDLE
      if (w._nextTool && now > w._nextAt){
        const t = w._nextTool; w._nextTool = null;
        sendToWork(w, t); // 큐에 밀려 있던 다음 작업 — 사이클 도중엔 목적지를 뺏기지 않는다
      } else if (w.jobState === 'active' && now > (w._restUntil || 0)){
        // ★사령관 지적(2026-08-11) "에이전트가 끝나는 것에 맞춰서 작업이 맞춰져야 의미가 있지 않나" —
        //   지금까지는 **도구 이벤트 하나 = 한 사이클**이라, 에이전트는 계속 일하는데 이벤트 사이 공백에는
        //   워커가 서 있었다(화면 대부분이 정지). 에이전트가 일하는 동안에는 워커도 쉬지 않고 이어서 일하고,
        //   에이전트가 멈추거나(blocked) 끝나면(done) 워커도 같이 멈춘다 — 그래야 화면이 실제 상태를 뜻한다.
        sendToWork(w, w._lastTool || 'Bash');
      } else if (w.mixer && now > w.holdUntil){
        // ★사령관 지적(2026-08-11) "안 움직이는 애들도 있음" — 도는 에이전트만 일하는 건 사양이 맞지만,
        //   일 안 하는 워커가 전부 같은 자세로 굳어 있으면 죽은 것처럼 보인다. **왜 안 움직이는지**가
        //   자세로 읽히게 상태별 대기 동작을 준다(발밑 링 색과 같은 정보를 몸으로도 보여준다).
        ensureLoopAction(w, IDLE_BY_JOB[w.jobState] || IDLE_CLIP);
      }
    }
  }
}

const clock = new THREE.Clock();
// 한 프레임 전부(믹서·상태머신·바다·하늘·렌더). rAF 루프와 수동 스텝(__step)이 같은 함수를 쓴다.
function frame(dt){
  const now = nowMs();
  for (const w of workers.values()){
    if (w.mixer) w.mixer.update(dt);

    // 이동·작업·납품 전이는 전부 상태 머신 한 곳에서(§3) — 이동은 스티어링 한 함수로(§4)
    tickWorker(w, now, dt);

    // 실제 섬 지형(BVH 레이캐스트)을 따라 y 갱신 — 평지가 아니라 굴곡 있는 real terrain이라 매 프레임 재측정.
    //   환초라 두 육지점 사이 직선 이동이 순간적으로 라군(물) 위를 지날 수 있음 — null이면 마지막 유효 y 유지(물에 안 잠기게).
    const gy = groundAt(w.group.position.x, w.group.position.z);
    if (gy != null) w.group.position.y = gy + 0.02;

    if (w.actionLabel.spr.visible && now > (w._labelUntil||0)) w.actionLabel.spr.visible = false;
  }
  ocean.update(dt);
  tickMining(dt);
  tickBuildSite(dt);
  updateYieldPopups(dt);
  if (grassMat) {
    grassMat.uniforms.uTime.value = performance.now()*0.001;
    grassMat.uniforms.uCamPos.value.copy(camera.position);
    // ★하늘 이식(2026-08-10): 잔디 블레이드 셰이더는 씬 조명을 안 받는 자체 발광 계산이라, 밤이 되면
    //   섬·워커·나무는 다 어두워지는데 잔디만 대낮처럼 밝게 남았다. 하늘의 밤 정도(night)로 같이 어둡게.
    if (ctx.sky) grassMat.uniforms.uLight.value = 1 - ctx.sky.night * 0.78;
    const md = 95*95;
    for (const m of grassChunks) { const dx=m.position.x-camera.position.x, dz=m.position.z-camera.position.z; m.visible = (dx*dx+dz*dz) < md; }
  }
  // sky.js / nightsky.js가 ctx.onUpdate로 등록한 갱신(태양 궤도·조명 곡선·구름 시간·하늘 돔 레이마칭).
  //   하나가 던져도 나머지 렌더가 멈추지 않게 개별로 감싼다.
  for (const fn of _updaters) { try { fn(dt); } catch (e) { console.warn('[hearthling] sky update fail', e); } }
  controls.update();
  renderer.render(scene, camera);
}
function animate(){
  requestAnimationFrame(animate);
  frame(clock.getDelta());
}
animate();

// ── 데모 캡처 — 백그라운드 탭은 rAF가 멈추므로, 가상 시계를 밀며 수동으로 프레임을 만든다 ──
// __step(dt): 한 프레임 진행+렌더 (__frame은 카메라 디버그 훅이 선점해서 이름을 피했다).
// __record(n, fps, w): n프레임을 연속으로 만들어 JPEG로 서버에 저장.
window.__step = (dt = 1/30) => { SIM_OFFSET += dt*1000; frame(dt); };
window.__recIdx = 0;
window.__record = async (frames = 120, fps = 24, width = 960) => {
  const src = renderer.domElement;
  const c = document.createElement('canvas');
  c.width = width; c.height = Math.round(src.height * width / src.width);
  const g = c.getContext('2d');
  for (let i = 0; i < frames; i++){
    window.__step(1/fps);
    g.drawImage(src, 0, 0, c.width, c.height);
    const n = String(window.__recIdx++).padStart(4, '0');
    await fetch('/api/snapshot?name=frame-' + n, { method: 'POST', body: c.toDataURL('image/jpeg', 0.85) });
  }
  return window.__recIdx;
};

// ══ 검증 훅 — 렌더 없이 상태 머신만 흘려보낸다 ══
// 워커 이동·작업·납품은 rAF에 묶여 있어 백그라운드 자동화 탭에서는 원리상 관찰이 불가능했다.
// 고정 dt로 tickWorker를 직접 돌려 "가서 → 캐고 → 지고 와서 → 납품"이 실제로 완주하는지 상태값으로 확인한다.
// (렌더·믹서는 건드리지 않으므로 사령관 화면의 시각 판정을 대체하지는 못한다 — 로직 회귀 검증용)
window.__simSteps = (seconds = 20, fps = 60) => {
  const dt = 1/fps, n = Math.round(seconds*fps);
  const seen = new Map(); // 워커별로 거쳐간 상태 순서
  for (let i = 0; i < n; i++){
    SIM_OFFSET += dt*1000;
    const now = nowMs();
    for (const [k, w] of workers){
      tickWorker(w, now, dt);
      const arr = seen.get(k) || (seen.set(k, []), seen.get(k));
      const s = w.state || 'IDLE';
      if (arr[arr.length-1] !== s) arr.push(s);
    }
  }
  return { delivered: deliveredCount, path: Object.fromEntries([...seen].map(([k,v]) => [k, v.join('>')])) };
};
window.__steer = (w, dt) => steerWorker(w, dt); // 디버그 훅(경로 수렴만 따로 검증)
window.__obstacles = OBSTACLES;                 // 건물 충돌 원 목록(건설현장 + 작업장 건물)
// 건설 현장 상태 — "에이전트가 끝나야 건물이 완성된다"를 검증하기 위한 훅
window.__buildInfo = () => ({ owner: buildOwnerId, ownerName: buildOwnerName, target: +buildTargetFill.toFixed(3),
  shown: +buildFillShown.toFixed(3), delivered: deliveredCount, need: DELIVERIES_PER_BUILDING, doneAt: buildDoneAt });
window.__updateBuildSite = (jobs) => updateBuildSite(jobs);
window.__deliver = (n) => { deliveredCount += (n || 1); return deliveredCount; };
window.__buildPos = () => buildSitePos && { x: buildSitePos.x, z: buildSitePos.z, r: buildSiteRadius };
window.__wstate = () => [...workers.values()].map(w => ({
  id: w.jobId, role: w.role || null, state: w.state || 'IDLE', cat: w.pendingCategory || null,
  carrying: !!w.carrying, waypoint: !!w.waypoint,
  distTarget: w.target ? +Math.hypot(w.target.x - w.group.position.x, w.target.z - w.group.position.z).toFixed(2) : null,
  distBuild: buildSitePos ? +Math.hypot(buildSitePos.x - w.group.position.x, buildSitePos.z - w.group.position.z).toFixed(2) : null,
  pos: [+w.group.position.x.toFixed(1), +w.group.position.z.toFixed(1)]
}));

// 현재 장면을 PNG로 서버에 저장한다 — 명시적으로 한 프레임 그린 직후 같은 틱에 toDataURL을 떠야
// preserveDrawingBuffer 없이도 화면이 담긴다(늦으면 검은 그림만 나온다).
window.__snap = async (width, type = 'image/png', quality = 0.9) => {
  renderer.render(scene, camera);
  const src = renderer.domElement;
  let dataUrl;
  if (width && width < src.width) {
    const c = document.createElement('canvas');
    c.width = width; c.height = Math.round(src.height * width / src.width);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    dataUrl = c.toDataURL(type, quality);
  } else {
    dataUrl = src.toDataURL(type, quality);
  }
  const r = await fetch('/api/snapshot', { method: 'POST', body: dataUrl });
  return r.json();
};

// ══ 하늘·해·구름 (실제 게임 sky.js + nightsky.js 원본) ══
// 순서는 게임 game.html과 동일: initSky → initNightSky. sky.js가 매 프레임 nightsky.setDayNight()로
// 낮/노을/밤 곡선과 태양 방향을 넘기고, nightsky 돔이 그걸 받아 하늘 자체를 그린다.
function initSkySystem(){
  ctx.water = ocean; // sky.js가 태양 방향·수평선 색을 바다에 동기(uSunDir/uHorizonCol)
  // sky.js는 태양(그림자 광원)을 `ctx.player.pos` 기준 500 거리에 놓아 그림자 프러스텀이 플레이어를 따라가게 한다.
  // 이 대시보드엔 플레이어가 없고 카메라가 ANCHOR에 고정이므로, ANCHOR를 그 자리에 끼워 넣는다 —
  // 안 하면 태양이 원점 기준으로 잡혀 ANCHOR(수십~수백 유닛 밖)의 그림자가 통째로 사라진다.
  ctx.player = { pos: { get x(){ return ANCHOR.x; }, y: 0, get z(){ return ANCHOR.z; } } };
  initSky(ctx);
  initNightSky(ctx);
  // ★사령관 선택(2026-08-10): 시간 흐름은 게임과 동일(20분에 하루 — 낮·노을·밤·별·달 전부).
  //   밤엔 워커가 어둡게 보이는 건 감수하기로 한 선택. 필요하면 __daycycle(0)으로 멈추고 __settime(0.25)로 정오 고정.
  ctx.sky.timeScale = 1;
  ctx.sky.setTime(0.10); // 게임 기본 시작값과 동일(아침)
  window.__daycycle = (v) => { ctx.sky.timeScale = (v == null ? 1 : +v); return ctx.sky.timeScale; };
  window.__settime  = (t) => ctx.sky.setTime(t);
  // sky.js는 게임 톤(ACESFilmic@0.62)을 강제로 설정한다. 이 대시보드는 20차에 실측으로 Neutral을 골랐고
  // (ACES가 초록을 흙빛으로 뭉갠다) 22차에 지형 색을 겨우 맞춰놨으므로, 톤매퍼만 되돌려 그 색을 지킨다.
  renderer.toneMapping = THREE.NeutralToneMapping;
  console.log('[hearthling] 하늘/해/구름 초기화 완료 — 20분 하루 사이클 가동, dayTime '+ctx.sky.getTime().toFixed(2)+'(__daycycle(0)으로 정지)');
}

(async () => {
  await loadHomeIsland();
  computeNodes();
  try { initSkySystem(); } catch (e) { console.warn('[hearthling] sky init fail', e); }
  // ★사령관 확인(2026-08-08, 스크린샷으로 직접 확인): Sea Keep "Lonely Watcher"는 원본 바위 모델 자체에
  //   구멍(시스택 디자인)이 뚫려 있어 어디에 놓든 그 틈으로 바다가 비쳐 보인다 — 산 위로 옮겨도 공중에 뜬
  //   물 웅덩이로 보여 오히려 더 이상해짐. 메시를 얼굴 단위로 재편집하기 전까진 랜드마크를 뺀다.
  // loadSeaKeepLandmark().catch(e => console.warn('[hearthling] sea keep load fail', e));
  await buildRealEnvironment(); // NODES.ore/forage를 실제 배치 결과로 채운 뒤에야 워커가 올바른 목적지로 걷는다
  loadBuildSite().catch(e => console.warn('[hearthling] build site load fail', e));
  loadWorkBuildings().catch(e => console.warn('[hearthling] work buildings load fail', e)); // 대장간·제재소·시장
  poll();
  setInterval(poll, 1000);
})();

// 사령관이 직접 드래그/휠로 카메라를 움직였으면 리사이즈 때 그 구도를 리셋하지 않는다.
let userMovedCam = false;
controls.addEventListener('start', () => { userMovedCam = true; });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  // ★22차: 창 비율이 바뀌면 화면에 담기는 좌우 폭(FRAME_R)이 달라진다 — 세로로 긴 창에서 워커가 프레임 밖으로
  //   밀려나던 문제와 같은 원인이라 리사이즈 때도 다시 맞춘다.
  if (!userMovedCam && islandReady) fitCameraToAnchor();
});
</script>
