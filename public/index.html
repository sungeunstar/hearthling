<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>hearthling</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  /* ══ 게임 HUD (2026-08-11 재설계) ══
     사령관 컨펌: "게임 HUD로 완전 전환" — 상단 요약 바 / 게임 화면 전체 / 하단 최근 활동 3줄 /
     워커 클릭 시 말풍선. 기존의 우측 job 카드 나열과 좌하단 raw 로그는 걷어낸다. */
  html, body { margin:0; height:100%; background:#0c0f0a; overflow:hidden;
    font-family:'Pretendard Variable', Pretendard, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; }
  :root { --ink:#eef3e9; --dim:rgba(238,243,233,.55); --line:rgba(255,255,255,.10);
    --panel:rgba(12,16,10,.72); --accent:#9fe07a; }
  .num { font-variant-numeric:tabular-nums; letter-spacing:-.01em; }

  /* 상단 바 */
  #topbar { position:fixed; top:0; left:0; right:0; height:52px; z-index:14;
    display:flex; align-items:center; gap:18px; padding:0 18px; color:var(--ink);
    background:linear-gradient(180deg, rgba(8,11,7,.82) 0%, rgba(8,11,7,.34) 62%, transparent 100%);
    pointer-events:none; }
  #topbar .brand { font-size:13px; font-weight:700; letter-spacing:.02em; opacity:.9; }
  #topbar .brand em { font-style:normal; color:var(--accent); }
  #topbar .spacer { flex:1; }
  #topbar .stat { display:flex; align-items:baseline; gap:6px; font-size:12px; color:var(--dim); }
  #topbar .stat b { font-size:15px; font-weight:700; color:var(--ink); }
  #topbar .sep { width:1px; height:16px; background:var(--line); }
  #usageBtn, #langBtn { pointer-events:auto; background:rgba(255,255,255,.06); border:1px solid var(--line);
    color:var(--ink); font:inherit; font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer; }
  #usageBtn:hover, #langBtn:hover { background:rgba(255,255,255,.12); }

  /* 세션이 하나도 없을 때 — 빈 마을이 고장으로 보이지 않게 */
  #emptyHint { position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); z-index:14;
    background:rgba(10,12,16,.82); border:1px solid rgba(255,255,255,.14); border-radius:12px;
    padding:18px 24px; text-align:center; max-width:min(420px, 86vw); display:none;
    backdrop-filter:blur(6px); }
  #emptyHint.show { display:block; }
  #emptyHint b { display:block; font-size:15px; margin-bottom:6px; }
  #emptyHint span { font-size:13px; color:rgba(255,255,255,.62); line-height:1.6; }

  /* 하단 최근 활동 */
  #feed { position:fixed; left:0; right:0; bottom:0; z-index:12; padding:0 18px 14px;
    display:flex; flex-direction:column; gap:5px; color:var(--ink); pointer-events:none;
    background:linear-gradient(0deg, rgba(8,11,7,.78) 0%, rgba(8,11,7,.28) 60%, transparent 100%); padding-top:44px; }
  #feed .row { display:flex; align-items:center; gap:9px; font-size:12px; opacity:.92;
    animation:feedIn .22s ease; }
  @keyframes feedIn { from { opacity:0; transform:translateY(5px); } to { opacity:.92; transform:none; } }
  #feed .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex:0 0 auto; }
  #feed .who { font-weight:600; }
  #feed .what { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 워커 말풍선 */
  #pop { position:fixed; z-index:15; display:none; min-width:186px; max-width:280px;
    background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line);
    border-radius:11px; padding:11px 13px; color:var(--ink); font-size:12px;
    box-shadow:0 14px 34px rgba(0,0,0,.45); }
  #pop.open { display:block; }
  #pop .ptop { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  #pop .pmodel { font-weight:700; font-size:13px; }
  #pop .pbadge { font-size:9.5px; padding:2px 6px; border-radius:5px; }
  #pop .ptitle { color:var(--dim); line-height:1.45; margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #pop .prow { display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:11.5px; }
  #pop .prow span { color:var(--dim); }
  #pop .phist { margin-top:9px; width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line);
    color:var(--ink); font:inherit; font-size:11px; padding:5px 0; border-radius:7px; cursor:pointer; }
  #pop .phist:hover { background:rgba(255,255,255,.13); }
  .st { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; }
  .st-active{background:#2e7d32;} .st-blocked{background:#a56b12;} .st-failed{background:#8a2f2f;} .st-done{background:#2f5f8a;} .st-completed{background:#2f5f8a;} .st-queued{background:#555;} .st-idle{background:#4a4f45;}
  /* ── job 히스토리 드로어(사령관 "git 히스토리뜨는것도 UX/UI 불편해보임" 2026-08-08 개선) ──
     기존: 왼쪽에 즉시 display:block되는 밋밋한 목록, user/assistant 구분 없음, state 색 없음, 긴 답변 통짜 텍스트.
     개선: 슬라이드 인 드로어 + user/assistant 턴 구분(말풍선 정렬) + job 카드와 동일한 state 색 배지 재사용 +
           상대시간 + 긴 답변은 기본 접힘(요약만) → 클릭 시 펼침(경량 마크다운: 코드블록/인라인코드/굵게만 처리). */
  #timeline { position:fixed; left:0; top:0; bottom:0; width:420px; max-width:92vw; background:rgba(14,18,11,.97); backdrop-filter:blur(6px); border-right:1px solid rgba(255,255,255,.1); box-shadow:18px 0 40px rgba(0,0,0,.35); z-index:20; display:flex; flex-direction:column; color:#e8efe0; font-size:12.5px; transform:translateX(-100%); transition:transform .22s ease; }
  #timeline.open { transform:translateX(0); }
  #timeline .tlHead { position:sticky; top:0; padding:16px 18px 12px; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(14,18,11,.97); flex:0 0 auto; }
  #timeline .tlHead .eyebrow { font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.5; margin-bottom:3px; }
  #timeline h3 { margin:0; font-size:14.5px; font-weight:700; line-height:1.35; padding-right:26px; }
  #timeline .tlCount { font-size:10.5px; opacity:.45; margin-top:3px; }
  #timeline .close { position:absolute; top:14px; right:16px; cursor:pointer; opacity:.55; width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:13px; }
  #timeline .close:hover { opacity:1; background:rgba(255,255,255,.08); }
  #timeline .tlBody { overflow:auto; padding:14px 16px 24px; flex:1 1 auto; }
  #timeline .empty { opacity:.45; padding:20px 4px; text-align:center; }
  #timeline .turn { display:flex; margin-bottom:12px; }
  #timeline .turn.user { justify-content:flex-end; }
  #timeline .turn.assistant { justify-content:flex-start; }
  #timeline .bubble { max-width:88%; border-radius:10px; padding:8px 10px; border:1px solid rgba(255,255,255,.08); }
  #timeline .turn.user .bubble { background:rgba(63,109,163,.16); border-color:rgba(120,170,220,.25); border-top-right-radius:2px; }
  #timeline .turn.assistant .bubble { background:rgba(255,255,255,.045); border-top-left-radius:2px; }
  #timeline .bmeta { display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:10px; opacity:.6; }
  #timeline .bmeta .who { font-weight:700; opacity:.85; }
  #timeline .pill { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9.5px; color:#fff; }
  #timeline .detail { white-space:pre-wrap; word-break:break-word; line-height:1.5; }
  #timeline .more { margin-top:6px; background:none; border:none; color:#8fd0ff; font-size:10.5px; cursor:pointer; padding:2px 0; opacity:.85; font-family:inherit; }
  #timeline .more:hover { opacity:1; text-decoration:underline; }
  #timeline .full { margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,.1); white-space:pre-wrap; word-break:break-word; line-height:1.55; font-size:12px; opacity:.92; display:none; }
  #timeline .full.show { display:block; }
  #timeline .full code { background:rgba(255,255,255,.1); padding:0 4px; border-radius:3px; font-size:11px; }
  #timeline .full pre { background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.08); border-radius:6px; padding:8px; overflow:auto; font-size:11px; margin:6px 0; }
  /* ── 토큰 사용량 패널(사령관 "일별로 주별로 얼마나 에이전트 토큰을 썼는지 알 수 있으면 좋겠다" 2026-08-11) ── */
  #usage { position:fixed; top:58px; right:18px; width:392px; max-width:92vw; max-height:78vh; overflow:auto; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:12px; box-shadow:0 18px 40px rgba(0,0,0,.45); z-index:21; color:var(--ink); font-size:12px; padding:14px 16px 18px; display:none; }
  #usage.open { display:block; }
  #usage h4 { margin:0 0 2px; font-size:13.5px; }
  #usage .sub { opacity:.5; font-size:10.5px; margin-bottom:12px; }
  #usage .sect { font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.5; margin:14px 0 7px; }
  #usage .row { display:grid; grid-template-columns:74px 1fr 76px; align-items:center; gap:8px; margin-bottom:5px; }
  #usage .row .lb { opacity:.72; font-size:11px; font-variant-numeric:tabular-nums; }
  #usage .row .vl { text-align:right; font-variant-numeric:tabular-nums; opacity:.9; }
  #usage .row.today .lb, #usage .row.today .vl { color:#9fe07a; opacity:1; font-weight:600; }
  #usage .track { height:13px; background:rgba(255,255,255,.05); border-radius:3px; overflow:hidden; display:flex; }
  #usage .track i { display:block; height:100%; }
  #usage .legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:10.5px; opacity:.75; }
  #usage .legend span i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }
  #usage .tot { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1); display:flex; justify-content:space-between; font-size:11.5px; }
  #usage .note { margin-top:9px; opacity:.42; font-size:10px; line-height:1.5; }
</style>
</head>
<body>
<div id="topbar">
  <div class="brand">hearth<em>ling</em></div>
  <div class="spacer"></div>
  <div class="stat"><b class="num" id="stActive">0</b> <span id="stActiveLb">작업 중</span></div>
  <div class="sep"></div>
  <div class="stat"><b class="num" id="stToday">–</b> <span id="stTodayLb">오늘 생성</span></div>
  <div class="sep"></div>
  <button id="usageBtn">사용량</button>
  <button id="langBtn">EN</button>
</div>
<div id="usage"></div>
<div id="feed"></div>
<div id="emptyHint"></div>
<div id="pop"></div>
<div id="timeline">
  <div class="tlHead">
    <span class="close" id="tlClose">✕</span>
    <div class="eyebrow">job 히스토리</div>
    <h3 id="tlTitle"></h3>
    <div class="tlCount" id="tlCount"></div>
  </div>
  <div class="tlBody" id="tlBody"></div>
</div>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh":"https://esm.sh/three-mesh-bvh@0.7.0?external=three",
  "three-bvh-csg":"https://esm.sh/three-bvh-csg@0.0.16?external=three,three-mesh-bvh"
}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
// ★사령관 지시(2026-08-10) "곡괭이질할 때 실제 게임처럼 물리엔진 적용, 점점 부서지는 거 그대로 구현" —
//   실제 게임 modules/mine.js가 쓰는 것과 같은 CSG(three-bvh-csg). 곡괭이가 닿을 때마다 작은 구를 빼서
//   진짜로 부피가 패이고(CARVE_MAX회 누적), 임계치에서 조각나며 Rapier 파편이 튄다.
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';
// ★사령관 지시(2026-08-10): "SKY도 불러와, 해랑 구름 시스템도" — 실제 게임 모듈을 **원본 그대로** 복사해 씀
//   (public/modules/sky.js, nightsky.js는 codex/tomob/modules/의 무수정 사본).
//   sky.js = 태양 방향·조명 곡선·태양 스프라이트·fbm 구름 돔·별/달, nightsky.js = 하늘 돔 본체(낮 하늘색·태양 디스크).
import { initSky } from './modules/sky.js';
import { initNightSky } from './modules/nightsky.js';

// ══ 언어 — 저장된 선택 > 브라우저 언어(ko→한국어, 그 외 영어). 전환은 리로드로 단순하게. ══
// 내부 상태 키(운반 모델 매칭 등)는 한국어 라벨을 그대로 쓰고, 화면에 그릴 때만 disp()로 번역한다 —
// 라벨을 통째로 바꾸면 CARRY_MODEL 매칭이 깨진다.
const LANG = (() => {
  try { const s = localStorage.getItem('hearthling-lang'); if (s === 'ko' || s === 'en') return s; } catch(e){}
  return (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
})();
const KO = LANG === 'ko';
const DISP_EN = {
  '나무':'Wood', '제작':'Planks', '보고':'Report', '벼림':'Forging', '목재':'Lumber', '교역':'Trade',
  '작업':'Work', '자원':'Goods', '돌':'Stone', '석탄':'Coal', '철광석':'Iron', '구리':'Copper',
  '주석':'Tin', '은':'Silver', '코발트':'Cobalt', '금':'Gold', '보석':'Gem',
  '에이전트':'Agent', '기타':'other'
};
const disp = s => KO ? s : (DISP_EN[s] || s);

// 정적 라벨은 한국어로 써 둔 것을 영어 모드에서 덮어쓴다. 전환 버튼은 저장 후 리로드.
{
  const langBtn = document.getElementById('langBtn');
  langBtn.textContent = KO ? 'EN' : '한국어';
  langBtn.onclick = () => {
    try { localStorage.setItem('hearthling-lang', KO ? 'en' : 'ko'); } catch(e){}
    location.reload();
  };
  if (!KO){
    document.getElementById('stActiveLb').textContent = 'working';
    document.getElementById('stTodayLb').textContent = 'generated today';
    document.getElementById('usageBtn').textContent = 'Usage';
    document.querySelector('#timeline .eyebrow').textContent = 'job history';
  }
  document.getElementById('emptyHint').innerHTML = KO
    ? '<b>아직 마을이 비어 있다</b><span>Claude Code 세션을 시작하면 워커가 나타난다.<br>최근 20분 안에 활동한 세션이 워커가 된다.</span>'
    : '<b>The village is empty</b><span>Start a Claude Code session and a worker will appear.<br>Sessions active in the last 20 minutes become villagers.</span>';
}

// ── 실제 게임(codex/tomob)과 동일한 BVH 가속 레이캐스트 — terrain.js의 groundAt과 같은 기법 ──
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// ── 실제 게임과 같은 물리엔진(Rapier) — 이 대시보드는 리지드바디까지는 안 쓰지만(워커는 스크립트 이동),
//   "물리엔진도 이미 구현돼 있다"는 사령관 지시대로 게임과 동일하게 실제로 붙여둔다.
let RAPIER = null, physicsWorld = null;
import('https://esm.sh/@dimforge/rapier3d-compat@0.14.0').then(async (mod) => {
  RAPIER = mod.default || mod;
  await RAPIER.init();
  physicsWorld = new RAPIER.World({ x: 0, y: -22, z: 0 });
  console.log('[hearthling] Rapier 물리엔진 초기화 완료(실제 게임과 동일 버전)');
}).catch(e => console.warn('[hearthling] Rapier load fail', e));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f0a);
scene.fog = new THREE.Fog(0x0c0f0a, 50, 170);

// ── 쿼터뷰(디아블로식 아이소메트릭) 카메라 — 사령관이 직접 저장한 실제 플레이 스크린샷(HUD 포함,
//   project/agentview/1.png)을 픽셀 단위로 실측(2026-08-08): 원형 제단(나락 제단)의 타원 비율(높이/너비≈0.47~0.6)
//   로 역산한 피치 ≈ 28~37°(수학적 '완전 등각' 35.264°에 더 가까움 — 기존 45°는 너무 가팔랐다). 캐릭터 키는
//   화면 높이의 약 17%(기존 세팅의 7~8%보다 훨씬 큼 — 실제 플레이 화면은 그렇게 안 멀리서 안 봄).
// ★사령관 선택(2026-08-10): "화면 상단에 하늘·수평선이 보이게" — 기하학적으로 피치 35°에서는 FOV를 70° 넘게
//   키우지 않는 한 수평선이 절대 화면에 안 들어온다(수평선은 시선 0°에 있는데 화면 상단이 피치-FOV/2 이므로).
//   그래서 피치를 눕히고 FOV를 넓힌다. 대신 12차에 실측으로 맞춘 **캐릭터 크기는 보존**한다 —
//   FOV가 넓어진 만큼 거리를 줄여 수직 시야폭(2·dist·tan(FOV/2))이 이전과 같아지게 DIST_MUL을 역산해뒀다.
//   하늘 비중 = (FOV/2 - PITCH) / FOV ≈ 17%.
const PITCH_DEG = 11.5; // 하늘 비중 ≈ (22.5-11.5)/45 ≈ 24% — 사령관이 고른 "상단 25%"에 맞춘 값
const FOV_DEG = 45;
// 이전 구도(FOV 26 · dist 1.65R)와 같은 수직 시야폭이 나오는 거리 배수 = 1.65·tan(13°)/tan(22.5°)
const DIST_MUL = 1.65 * Math.tan(26/2 * Math.PI/180) / Math.tan(FOV_DEG/2 * Math.PI/180);
const camera = new THREE.PerspectiveCamera(FOV_DEG, innerWidth/innerHeight, 0.1, 900);
camera.position.set(0, 34, 32);
camera.lookAt(0, 4, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
// ★사령관 "게임 본편 섬 다시가서 확인해봐"(2026-08-08) — 실제 게임을 직접 켜서 색이 더 진하고 채도
// 높다는 걸 확인. `modules/sky.js`(initSky)엔 ACESFilmicToneMapping@0.62가 있었지만, 그대로 이식해서
// 스크린샷 픽셀을 직접 실측해보니(Python) 초록이 (130,127,110) 같은 흙빛으로 뭉개졌다 — 알고 보니
// sky.js 주석에 실제 게임팀도 "ACESFilmic이 하이라이트를 흰색/무채색으로 수렴시켜 채도가 레퍼런스의

// 필요, 이 프로젝트가 쓰는 three@0.160.0엔 없음).
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.inset = '0';
renderer.domElement.style.zIndex = '0';

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 26;
controls.maxDistance = 75;
controls.minPolarAngle = THREE.MathUtils.degToRad(32);
// ★하늘 이식(2026-08-10): 기존 상한 64°에서는 카메라를 아무리 눕혀도 수평선 위가 화면에 안 들어와
//   해·구름·하늘을 볼 수 없었다. 기본 구도(35.264° 피치)는 그대로 두고 드래그 여유만 늘린다.
controls.maxPolarAngle = THREE.MathUtils.degToRad(86);
controls.update();
window.__camera = camera; window.__controls = controls; // 디버그 훅

// ★사령관 지적(2026-08-08, 재지적): "디아블로 쿼터뷰가 아님" — 실제 디아블로4 스크린샷을 직접 찾아 대조
//   (WebSearch 이미지 결과): 핵심은 피치 각도뿐 아니라 카메라가 타겟을 정면(+Z축)이 아니라 **대각선(요(yaw) 45°)
//   에서 내려다본다**는 것 — 그래야 건물·지형이 두 면이 동시에 보이는 등각 느낌이 난다. 기존엔 pitch만 맞고
//   yaw가 거의 0(정면)이라 "그냥 위에서 본 원근 카메라"처럼 보였다.
const YAW_DEG = 45;
// ★버그(2026-08-08 22차 실측): 워커·노드 배치 반경(ACTIVITY_RADIUS=42 고정)이 카메라가 실제로 담는 화면 범위보다
//   훨씬 넓어서 워커가 전원 프레임 밖에 있었다(NDC x = 1.18 / 3.61 / -2.34로 실측). 좁은 FOV(26°)에서 병목은
//   좌우이고, 그 폭은 창 비율(aspect)에 정비례한다 — 세로로 긴 창에서는 더 심해진다.
//   → 여기서 "카메라가 실제로 담는 지면 반경"(FRAME_R)을 투영 파라미터로 직접 계산하고,
//     워커 스폰·노드 배치는 전부 이 값을 기준으로 삼는다(고정 상수 대신).
let FRAME_R = 21; // fitCameraToAnchor()에서 실제 투영값으로 덮어씀(선언 순서상 ACTIVITY_RADIUS를 아직 못 읽어 리터럴)
let DEPTH_GAIN = 1;                       // 화면 상하(깊이) 방향으로 더 넓게 배치할 배율
const CAM_FWD = new THREE.Vector3(0,0,-1);  // 카메라가 보는 수평 방향(=화면 상하 축)
const CAM_RIGHT = new THREE.Vector3(1,0,0); // 화면 좌우 축
let islandReady = false; // 섬 로드+ANCHOR 확정 후에만 재프레이밍이 의미 있다(리사이즈 핸들러 가드)
// 카메라 거리 — fitCameraToAnchor와 cameraViewBlockedAt(ANCHOR 후보의 시야 판정)이 **같은 값**을 써야
// "후보로는 통과했는데 실제로는 산에 파묻히는" 어긋남이 안 생긴다.
function camDistance(){
  const aspect = innerWidth / innerHeight;
  // 세로로 긴 창(사령관 모니터 1440×2560)에서는 좌우 시야가 좁아 활동권이 안 들어온다 → 최소한만 후퇴.
  const zoomComp = Math.min(1.15, Math.max(1, 1.6 / aspect));
  return ACTIVITY_RADIUS * DIST_MUL * zoomComp;
}
function fitCameraToAnchor(){
  // ★실측(1.png 픽셀 크롭 대조) 기준 재조정 — 캐릭터 키 ≈ 화면 높이 17%가 되도록 거리를 줄였다
  // (기존 3.6R=7~8%는 실제 플레이 화면보다 훨씬 멀었음).
  camera.aspect = innerWidth / innerHeight;
  // ★사령관 모니터는 세로(1440×2560, aspect≈0.6) — 좌우 시야가 좁다. 여기서 카메라를 뒤로 빼서 해결하면
  //   12차에 실측으로 맞춘 "캐릭터가 크게 보이는" 구도가 다시 망가진다. 그래서 후퇴는 최소로만 하고(≤1.15배),
  //   대신 워커/노드 배치를 화면 모양에 맞춘 타원(좌우 좁게·깊이 넓게)으로 돌린다(hashPos 참고).
  const dist = camDistance();
  const pitchRad = THREE.MathUtils.degToRad(PITCH_DEG);
  const yawRad = THREE.MathUtils.degToRad(YAW_DEG);
  const horiz = dist * Math.cos(pitchRad), height = dist * Math.sin(pitchRad);
  // ★버그(22차): 타겟 y가 절대값(ACTIVITY_RADIUS*0.15=6.3)이었는데 이 섬의 ANCHOR 지면 높이는 13.1이라
  //   실제로는 지면보다 7m 아래를 조준하고 있었다 — 그래서 화면 아래 40%가 텅 빈 지면이고 중앙 건물은
  //   위로 잘려나갔다. 지면 높이 기준으로 잡고, 건물 중간쯤을 화면 중앙에 둔다.
  const groundY = groundAt(ANCHOR.x, ANCHOR.z) ?? 0;
  const focusY = groundY + Math.max(4, buildSiteHeight * 0.45);
  camera.position.set(ANCHOR.x + horiz*Math.sin(yawRad), focusY + height, ANCHOR.z + horiz*Math.cos(yawRad)); // 35.264° 피치 + 45° 요(대각선)
  controls.target.set(ANCHOR.x, focusY, ANCHOR.z);
  // ★하한이 기본 거리보다 크면 controls가 매 프레임 카메라를 밖으로 밀어내 구도가 어긋난다(FOV를 넓히며
  //   기본 거리가 42→약 39로 줄었으므로 하한도 같이 낮춘다).
  controls.minDistance = ACTIVITY_RADIUS*0.6;
  controls.maxDistance = ISLAND_RADIUS*4;
  camera.lookAt(controls.target);
  controls.update();
  scene.fog.near = Math.max(ACTIVITY_RADIUS*2.4, ISLAND_RADIUS*0.7);
  scene.fog.far = ISLAND_RADIUS * 5.5;
  // 태양 그림자 프러스텀 — 이 대시보드는 카메라가 ANCHOR 근처 고정이라(real game처럼 플레이어 추종 불필요)
  // ANCHOR 중심으로 활동반경만 넉넉히 덮으면 된다.
  sun.target.position.set(ANCHOR.x, groundY, ANCHOR.z);
  sun.position.set(ANCHOR.x + 20, groundY + 40, ANCHOR.z + 10);
  const SR = ACTIVITY_RADIUS * 1.4;
  const sc = sun.shadow.camera;
  // ★22차(하늘 이식): sky.js가 태양을 ANCHOR에서 500 거리에 놓으므로 far 200으로는 그림자가 아예 안 잡힌다.
  sc.near = 50; sc.far = 1200; sc.left = -SR; sc.right = SR; sc.top = SR; sc.bottom = -SR;
  sc.updateProjectionMatrix();
  // ★하늘 이식(2026-08-10): nightsky 하늘 돔은 반경 6500, sky.js 구름 돔은 5000, 별은 4000이다
  //   (게임 core.js 카메라 far=8000 기준으로 설계된 값). 기존 far(ISLAND_RADIUS*10≈3150)로는 하늘·구름·해가
  //   통째로 클리핑돼 배경색만 보였다 — 게임과 같은 8000을 하한으로 둔다.
  camera.far = Math.max(8000, ISLAND_RADIUS * 10);
  camera.updateProjectionMatrix();
  // 타겟 지점에서 화면 좌우 절반이 덮는 월드 거리 = dist*tan(fov/2)*aspect. 초광폭 창에서 배치가 과하게
  // 퍼지지 않게 aspect는 1.9에서 자른다. 0.82는 화면 가장자리에 워커가 반쯤 걸치지 않게 두는 여유.
  const halfW = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2) * Math.min(camera.aspect, 1.9);
  FRAME_R = Math.max(12, halfW * 0.82);
  // 화면 상하(=지면 깊이 방향)는 카메라가 지면을 비스듬히 보므로 좌우보다 훨씬 넓게 담긴다 — 세로 모니터일수록
  // 그 여유가 커진다. 배치를 이 비율의 타원으로 돌려야 캐릭터를 키운 채로 전원 프레임에 넣을 수 있다.
  // ★피치를 15°로 눕히면서 상한을 낮췄다 — 낮은 각도에서는 깊이 방향이 화면에서 심하게 압축돼,
  //   예전 배율(최대 2.6)로 깔면 앞뒤 워커가 서로 겹쳐 보인다.
  DEPTH_GAIN = Math.min(1.45, Math.max(1, 1.25 / camera.aspect));
  camera.getWorldDirection(CAM_FWD); CAM_FWD.y = 0; CAM_FWD.normalize();
  CAM_RIGHT.set(-CAM_FWD.z, 0, CAM_FWD.x);
  const oceanNeed = Math.max(1, (ISLAND_RADIUS*5) / 700);
  ocean.mesh.scale.set(oceanNeed, 1, oceanNeed);
  window.__frame = { dist, aspect:camera.aspect, FRAME_R }; // 디버그 훅
}
// 어떤 지면 좌표가 실제로 지금 화면 안에 잡히는지 투영으로 직접 판정(계산 가정이 아니라 실제 카메라 행렬 기준).
const _framePv = new THREE.Vector3();
function inFrame(x, z, margin){
  const y = groundAt(x, z);
  _framePv.set(x, (y == null ? 0 : y) + 1.6, z).project(camera);
  const m = margin == null ? 0.88 : margin;
  return Math.abs(_framePv.x) < m && Math.abs(_framePv.y) < m && _framePv.z < 1;
}

// ★사령관 지적(2026-08-08 "섬 바닥 실제로 저 색깔 아닌데?") — codex/tomob `modules/core.js`의 실제 조명값과
//   대조해보니 hemi 지면색이 훨씬 어두웠고(0x1a1f14 거의 검정 vs 실제 0x6f8a99) sun 광량도 거의 절반(0.9 vs 1.6)
//   이었다. 지형 텍스처 자체가 아니라 조명이 부족해서 칙칙/회색으로 보인 것 — core.js 값 그대로 이식.
const hemi = new THREE.HemisphereLight(0xffffff, 0x6f8a99, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 1.6);
sun.position.set(20, 40, 10);
scene.add(sun);
// 그림자도 real game과 동일하게 core.js에서 켜져 있는데(castShadow=true 이식 코드는 많음) 이 대시보드는
// renderer.shadowMap 자체가 꺼져 있어 전부 죽은 코드였다(정확히 real game이 예전에 겪은 것과 같은 버그).
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true; // 건설 게이지(아래에서 차오르는 절단면)가 이 옵션 없이는 동작하지 않는다
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun.target);
// ★sky.js가 시간대 곡선으로 함께 조절하는 보조광 — 실제 게임 core.js에도 같은 역할로 존재한다.
//   fill = 태양 반대편에서 역광면을 들어올리는 약한 방향광, amb = 캐노피 아랫면이 검게 죽는 걸 막는 최소 환경광.
const fill = new THREE.DirectionalLight(0xbcd3ff, 0.0);
scene.add(fill);
const amb = new THREE.AmbientLight(0xffffff, 0.0);
scene.add(amb);

// ══ 게임 모듈(sky.js / nightsky.js)이 기대하는 최소 ctx 셰임 ══
//   실제 게임의 ctx는 훨씬 크지만 이 두 모듈이 실제로 쓰는 건 아래가 전부다(코드 확인 후 최소로 구성).
//   ctx.player/wind/dungeon은 없으므로 두 모듈의 해당 분기는 자동으로 "평지·맑음·던전 아님"으로 흐른다.
const _updaters = [];
const ctx = {
  scene, camera, renderer, sun, hemi, fill, amb,
  onUpdate(fn){ _updaters.push(fn); },
};
window.__ctx = ctx; // 디버그 훅

// ══ 실제 게임(codex/tomob)의 섬 에셋을 그대로 로드 ══
// 사령관이 직접 만든 홈 세션(voyage_islands_backup.json "시작의섬 카브")의 실제 배치 그대로 재현 —
// terrain.js 세션 포맷({objs:[{url,x,y,z,rotY,scale}]})의 좌표를 그대로 사용, 임의 재배치 없음.
const REAL = './assets/real/';
const collide = []; // terrain.js의 collide 배열과 동일한 역할 — groundAt이 이 목록만 레이캐스트
let ISLAND_RADIUS = 30; // 전체(본섬+산) 실측 반경 — 안개/바다 크기 기준
let ATOLL_RADIUS = 30;  // 본섬(환초)만의 실측 반경 — Sea Keep 크기·라군 위치 기준
let ANCHOR = { x: 0, z: 0 }; // 카메라·워커가 실제로 모이는 육지 위 기준점(원점=라군이라 원점 자체는 못 씀)
let LAGOON_CENTER = { x: 0, z: 0 }; // 본섬(환초)의 라군 한가운데 — Sea Keep 배치 기준
let ATOLL_ROOT = null; // 본섬 FBX 루트 — environment.js식 나무/잔디 배치의 bbox 기준
let MOUNTAINS = []; // {x,z,r} 산 footprint — environment.js와 동일하게 광석 링 배치 기준
const ACTIVITY_RADIUS = 42;  // ANCHOR 주변 반경 — "움직이는 걸 보여주는" 클로즈업 활동 범위(전체 섬 크기와 무관하게 고정)

const _groundRay = new THREE.Raycaster();
_groundRay.firstHitOnly = true;
function groundAt(x, z, fromY){
  _groundRay.set(new THREE.Vector3(x, fromY==null?800:fromY, z), new THREE.Vector3(0,-1,0));
  const hh = _groundRay.intersectObjects(collide, true);
  return hh.length ? hh[0].point.y : null; // null = 이 지점엔 섬 메시가 없다(라군/바깥바다 위 허공)
}
// ★실제 이 섬(CPT_Island_H_a_06)은 가운데가 뚫린 환초(atoll) 형태 — 중앙에 라군(물)이 있어
//   원점 기준 단순 반경식으로 좌표를 잡으면 육지가 아니라 라군 위에 스폰된다("캐릭터가 바다에 있음" 원인).
//   groundAt이 null(메시 없음)이거나 해수면(y=0) 근처/아래(라군 바닥)면 육지가 아닌 것으로 판정한다.
// ★근본 원인(2026-08-08, 세 번째 지적): 0.3은 내가 임의로 정한 값이었다 — 실제 environment.js는 WATER_Y=2.0을
//   쓴다(파도 진폭이 1.5~2유닛대라 0.3은 파도가 계속 넘나드는 마진). 실제 상수로 교체.
const WATER_LEVEL = 2.0;
function isLandAt(x, z){
  const y = groundAt(x, z);
  return (y != null && y > WATER_LEVEL) ? y : null;
}
// 목표 지점이 물이면 골든앵글 나선으로 주변을 훑어 가장 가까운 실제 육지를 찾는다(결정적 — 새로고침해도 동일 결과).
function findLandNear(x0, z0, maxTries){
  let y = isLandAt(x0, z0);
  if (y != null) return { x:x0, z:z0, y };
  maxTries = maxTries || 60;
  for (let i=1; i<=maxTries; i++){
    const ang = i * 2.399963; // 골든 앵글 — 나선형으로 고르게 탐색
    const rad = Math.sqrt(i) * (ATOLL_RADIUS*0.05);
    const x = x0 + Math.cos(ang)*rad, z = z0 + Math.sin(ang)*rad;
    y = isLandAt(x, z);
    if (y != null) return { x, z, y };
  }
  return { x:0, z:0, y:1 }; // 사실상 발생 안 함(섬 전체가 물일 때만)
}
// ★사령관이 실제 게임을 직접 켜서 확인해보라고 지시(2026-08-08) — ANCHOR(카메라 기본 시점·건설 현장
// 중심)를 실측해보니 반경 30m 안이 64%가 모래/황토 쿼드런트였다(섬 전체 평균은 76% 초록인데도). 기존

function findGreenBasinNear(x0, z0){
  const cands = [];
  if (isGreenWalkableAt(x0, z0) != null) cands.push({ x:x0, z:z0 });
  const STEP = 10;
  for (let i=1; i<=250 && cands.length < 14; i++){
    const ang = i * 2.399963, rad = Math.sqrt(i) * STEP;
    const x = x0 + Math.cos(ang)*rad, z = z0 + Math.sin(ang)*rad;
    if (isGreenWalkableAt(x, z) != null) cands.push({ x, z });
  }
  if (!cands.length) return findLandNear(x0, z0);
  // 카메라 시야가 지형에 막히지 않는 후보를 우선 — 전부 막히면(좁은 섬 등) 어쩔 수 없이 전체에서 고른다.
  const open = cands.filter(c => !cameraViewBlockedAt(c.x, c.z));
  const pool = open.length ? open : cands;
  let best = pool[0], bestRatio = -1;
  for (const c of pool){ const r = greenRatioAround(c.x, c.z); if (r > bestRatio){ bestRatio = r; best = c; } }
  console.log('[hearthling] ANCHOR 선정 — 후보 '+cands.length+'개(시야 트인 곳 '+open.length+'개) 중 주변 초록 비율 '+(bestRatio*100).toFixed(0)+'%인 지점');
  return { x: best.x, z: best.z, y: groundAt(best.x, best.z) ?? 0 };
}

// ★진짜 근본 원인(2026-08-08, 다섯 번째 확인): WATER_LEVEL(2.0)을 넘겨도 "겨우 2~4유닛" 높이의 지형은
//   바다 셰이더의 파도 변위(진폭 최대 ~3유닛)가 그 위를 계속 덮친다 — 숫자로는 '육지'인데 파도가 넘실대며

function isRobustLandAt(x, z, minY){
  const y = groundAt(x, z);
  return (y != null && y > minY) ? y : null;
}
// ★진짜 진짜 진짜 근본 원인(2026-08-08, 실측 raycast로 최종 확인): Sea Keep의 바위 밑동 자체가
//   아치·동굴처럼 구멍이 숭숭 뚫린 형태(원본 에셋 컨셉 자체가 "바다에서 솟은 바위섬")라, 육지가 해수면에서
//   조금만 높아도(4~8유닛) 그 틈으로 바다가 계속 비쳐 보인다. 육지 판정이 아니라 "충분히 높은 지대"가 필요.
function findHighestPoint(cx, cz, radius, gridN){
  radius = radius || 90; gridN = gridN || 20;
  let best = null, bestY = -Infinity;
  for (let i=0; i<gridN; i++){
    for (let j=0; j<gridN; j++){
      const x = cx - radius + (i/(gridN-1))*radius*2;
      const z = cz - radius + (j/(gridN-1))*radius*2;
      const y = groundAt(x, z);
      if (y != null && y > bestY){ bestY = y; best = { x, z, y }; }
    }
  }
  return best || { x:cx, z:cz, y:0 };
}
function findDeepestInland(cx, cz, radius, gridN, maxCheckR, minY){
  radius = radius || 90; gridN = gridN || 22; maxCheckR = maxCheckR || 70; minY = minY || 8;
  let best = null, bestDist = -1;
  for (let i=0; i<gridN; i++){
    for (let j=0; j<gridN; j++){
      const x = cx - radius + (i/(gridN-1))*radius*2;
      const z = cz - radius + (j/(gridN-1))*radius*2;
      if (isRobustLandAt(x, z, minY) == null) continue;
      let minWaterDist = maxCheckR;
      outer: for (let k=0; k<8; k++){
        const a = (k/8)*Math.PI*2;
        for (let r=7; r<=maxCheckR; r+=7){
          if (isRobustLandAt(x+Math.cos(a)*r, z+Math.sin(a)*r, minY) == null){ minWaterDist = Math.min(minWaterDist, r); continue outer; }
        }
      }
      if (minWaterDist > bestDist){ bestDist = minWaterDist; best = { x, z }; }
    }
  }
  return best || findLandNear(cx, cz);
}

let _atlasCanvas = null;
function loadAtlasCanvas(url){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { try {
      const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
      const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(im, 0, 0);
      _atlasCanvas = { cx, w: cv.width, h: cv.height };
    } catch (e) {} res(); };
    im.onerror = () => res();
    im.src = url;
  });
}
function isGreenAt(hit){
  if (!_atlasCanvas || !hit || !hit.uv) return true;
  let u = hit.uv.x - Math.floor(hit.uv.x), v = hit.uv.y - Math.floor(hit.uv.y);
  // ★22차: 렌더 텍스처를 flipY=true(실제 게임과 동일)로 되돌렸으므로 판정도 같은 규칙이어야 한다 —
  //   v=0이 이미지의 아래쪽에 대응하니 캔버스 픽셀 좌표(위가 0)로 바꾸려면 v를 뒤집는다.
  //   즉 environment.js 원본의 v=1-v가 처음부터 옳았고, 20차에서 그걸 뺀 것이 오진이었다.
  v = 1 - v;
  const px = Math.min(_atlasCanvas.w-1, Math.max(0, (u*_atlasCanvas.w)|0));
  const py = Math.min(_atlasCanvas.h-1, Math.max(0, (v*_atlasCanvas.h)|0));
  const d = _atlasCanvas.cx.getImageData(px, py, 1, 1).data;
  return d[1] > d[0]+8 && d[1] > d[2]+14 && d[1] > 60;
}

function groundHit(x, z, meshes){
  _groundRay.set(new THREE.Vector3(x, 800, z), new THREE.Vector3(0,-1,0));
  const hh = _groundRay.intersectObjects(meshes || collide, true);
  return hh.length ? hh[0] : null;
}

    // ★64×64에 딱 4개의 넓은 단색 사분면뿐인 텍스처라, 대시보드처럼 카메라가 멀어지면 GPU 밉맵 축소가
    // 인접 사분면(초록·회색·황토·흰색)을 뭉개서 평균 낸 칙칙한 회갈색으로 보인다(실측: 화면 픽셀이 atlas
    // 원본 4색 어디에도 안 맞고 그 사이 애매한 값으로 나옴). 밉맵을 꺼서 항상 또렷한 원색이 나오게 한다.
    atlas.generateMipmaps = false;
    atlas.minFilter = THREE.LinearFilter;
    atlas.magFilter = THREE.LinearFilter;
  }

  const cx = (HOME_PIECES[0].x + HOME_PIECES[1].x) / 2;
  const cz = (HOME_PIECES[0].z + HOME_PIECES[1].z) / 2;

  const fbxL = new FBXLoader();
  fbxL.setResourcePath(REAL + 'island/Textures/');
  const group = new THREE.Group();
  let atollLocal = { x: 0, z: 0 };
  for (const piece of HOME_PIECES) {
    const root = await new Promise((res, rej) => fbxL.load(REAL + 'island/Meshes/' + piece.file, res, undefined, rej));
    root.scale.setScalar(0.01 * piece.scale); // ★terrain.js와 동일 0.01 보정 + 카브 세션에 저장된 개별 배율 그대로
    root.position.set(piece.x - cx, piece.y, piece.z - cz); // 카브 세션 원 배치(중심만 원점 근처로 재정렬, 상대거리는 원본 그대로)
    root.rotation.y = piece.rotY || 0;
    root.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      o.geometry.computeBoundsTree();
      // ★이 FBX의 임베드 머티리얼이 실존하지 않는 'colormap.png'를 참조(원본 에셋의 죽은 링크) →
      //   조건부(!m.map)로는 걸러지지 않아 무조건 실제 아틀라스로 덮어쓴다.
      // ★사령관이 실제 게임 켜서 확인해보라고 지시(2026-08-08) — 진짜 원인 발견: 이 FBX가 임포트될 때
      //   MeshPhongMaterial의 emissive가 흰색(0xffffff)으로 들어와 있었다. emissive는 조명과 무관하게
      //   그 색 그대로 더해지므로, 조명·아틀라스 색이 다 맞아도 흰색이 계속 얹혀 전체가 창백/회색으로
      //   보인 것(직접 raycast로 UV가 정확히 초록 사분면을 가리키는데도 렌더 픽셀은 베이지였던 이유).
      //   나무 프로토(loadTreeProtos)에서는 이미 emissive를 0으로 꺼주고 있었는데 섬 지형 쪽만 빠져있었다.
      //   emissive를 꺼도 여전히 회색이길래 재조사 — MeshPhongMaterial의 specular도 흰색(0xffffff)에
      //   shininess 9.6(낮음=넓게 퍼지는 하이라이트)으로 들어와 있었다. 로우폴리 지형 전체 면적에 걸쳐
      //   두 광원(hemi+sun) 하이라이트가 넓게 퍼져 덮이면서 색을 하얗게 씻어내고 있었던 것 — 이게 진짜
      //   마지막 원인. 잔디/땅은 매트 표면이어야 하므로 specular도 꺼서 정반사 자체를 없앤다.
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m) { m.map = atlas; if (m.color) m.color.set(0xffffff); if (m.emissive) m.emissive.set(0x000000); if (m.specular) m.specular.set(0x000000); m.needsUpdate = true; } });
    });
    group.add(root);
    collide.push(root);
    if (piece.isAtoll) {
      atollLocal = { x: piece.x - cx, z: piece.z - cz };
      const abb = new THREE.Box3().setFromObject(root);
      const asize = new THREE.Vector3(); abb.getSize(asize);
      ATOLL_RADIUS = Math.max(6, Math.max(asize.x, asize.z) / 2 * 0.85);
      ATOLL_ROOT = root;
    } else {
      // environment.js와 동일: 산 footprint(중심+반경) — 광석 링 배치·나무 배제 기준
      const mbb = new THREE.Box3().setFromObject(root);
      const msize = new THREE.Vector3(); mbb.getSize(msize);
      const mcenter = new THREE.Vector3(); mbb.getCenter(mcenter);
      MOUNTAINS.push({ x: mcenter.x, z: mcenter.z, r: Math.max(msize.x, msize.z) * 0.5 });
    }
  }
  scene.add(group);

  const bb = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); bb.getSize(size);
  ISLAND_RADIUS = Math.max(6, Math.max(size.x, size.z) / 2 * 0.85);

  // ★findGreenLandNear 산 제외 반경을 완화(0.4배)하고 나니(위 함수 주석 참고) 실제로 초록 지대를 찾아냄
  // — 산에서 아주 바짝 붙지만 않으면 산 발치 근방이 이 섬에서 가장 잔디가 짙은 곳이었다.
  const anchorSeed = findGreenBasinNear(atollLocal.x + ATOLL_RADIUS * 0.25, atollLocal.z);
  ANCHOR = { x: anchorSeed.x, z: anchorSeed.z };
  LAGOON_CENTER = atollLocal;

  console.log('[hearthling] 실제 홈 섬("시작의섬 카브") 로드 완료 — 전체 반경≈'+ISLAND_RADIUS.toFixed(1)+'m, 활동거점('+ANCHOR.x.toFixed(0)+','+ANCHOR.z.toFixed(0)+')');
  islandReady = true;
  fitCameraToAnchor();
  window.__islandGroup = group; window.__atlas = atlas; window.__THREE = THREE; window.__anchor = ANCHOR; // 디버그 훅
  window.__mountains = MOUNTAINS; window.__groundHit = groundHit; window.__isGreenAt = isGreenAt; window.__findGreenLandNear = findGreenLandNear; window.__atollLocal = atollLocal;
  return ISLAND_RADIUS;
}

// ══ 실제 게임의 바다(water.js) 코어를 이식 — 같은 파도 스펙트럼·노멀맵·프레넬·SSS·거품 셰이더.
//   날씨/밤/배웨이크/하늘반사프로브 등 다른 시스템에 종속된 부분은 이 대시보드엔 없어서 제외(항상 맑은 낮 고정). ──
function buildRealOcean(){
  const tl = new THREE.TextureLoader();
  const wl = u => { const t = tl.load(u); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };
  const WAVES = [
    {a:0.42,f:0.011,A:1.55,s:0.30}, {a:2.61,f:0.016,A:1.70,s:0.36}, {a:4.53,f:0.009,A:1.25,s:0.26},
    {a:1.15,f:0.042,A:1.45,s:0.58}, {a:3.34,f:0.058,A:1.15,s:0.70}, {a:5.41,f:0.035,A:1.25,s:0.52}, {a:0.87,f:0.078,A:0.75,s:0.85},
    {a:3.92,f:0.105,A:0.42,s:1.00}, {a:2.08,f:0.130,A:0.32,s:1.15}, {a:5.90,f:0.155,A:0.26,s:1.25}, {a:4.77,f:0.185,A:0.22,s:1.40}, {a:1.63,f:0.235,A:0.14,s:1.60},
  ];
  const _wg = (() => { const P=[],AM=[],H=[],SX=[],SZ=[];
    WAVES.forEach((w,i) => { const c=Math.cos(w.a), s=Math.sin(w.a), kx=+(c*w.f).toFixed(6), kz=+(s*w.f).toFixed(6), sc=w.f<0.10?'uSwell':'uWaveAmp';
      P.push(`float p${i}=${kx}*x+${kz}*z+uTime*${w.s.toFixed(3)};`);
      AM.push(`float A${i}=${w.A.toFixed(3)}*${sc};`);
      H.push(`sin(p${i})*A${i}`); SX.push(`cos(p${i})*A${i}*${kx}`); SZ.push(`cos(p${i})*A${i}*${kz}`);
    });
    return { pre:P.join('')+AM.join(''), h:H.join('+'), sx:SX.join('+'), sz:SZ.join('+') };
  })();

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:{value:0}, uWaveAmp:{value:1.0}, uSwell:{value:1.05}, uWaveN:{value:30.0}, uFoam:{value:0.85},
      uNormA:{value:wl(REAL+'water/water_normal_calm.png')}, uNormB:{value:wl(REAL+'water/water_normal_roll.png')}, uNormC:{value:wl(REAL+'water/water_normal_turb.png')},
      uSunDir:{value:new THREE.Vector3(0.45,0.8,0.35).normalize()},
      uShallow:{value:new THREE.Color(0x33cdba)}, uDeep:{value:new THREE.Color(0x0a5a6e)}, uSun:{value:new THREE.Color(0xfff0c8)},
      uHorizonCol:{value:new THREE.Color(0xa6cbe8)},
      uSSS:{value:1.0}, uSSSPow:{value:3.2}, uSSSCol:{value:new THREE.Color(0.16,0.92,0.78)},
      // ★sky.js가 매 프레임 바다에 주입하는 값들(밤 정도·달 방향·폭풍). 이 대시보드의 바다 셰이더는 아직
      //   이 값들을 실제로 쓰진 않지만, 선언이 없으면 sky.js가 그대로 크래시한다(원본 코드에 가드가 없음).
      //   uSunDir·uHorizonCol은 이미 있어서 태양 방향과 수평선 색이 하늘과 자동으로 동기된다.
      uNight:{value:0}, uMoonDir:{value:new THREE.Vector3(0,-1,0)}, uStorm:{value:0},
    },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`uniform float uTime;uniform float uWaveAmp;uniform float uSwell;varying vec3 vWorld;varying vec3 vView;varying vec2 vSlope;varying float vWaveH;
      void main(){vec4 wp=modelMatrix*vec4(position,1.0);float x=wp.x,z=wp.z;
        ${_wg.pre}
        float h=${_wg.h};
        vWaveH=h; wp.y+=h;
        float dx=${_wg.sx}; float dz=${_wg.sz}; vSlope=vec2(dx,dz);
        vWorld=wp.xyz;vView=cameraPosition-wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
    fragmentShader:`uniform float uTime;uniform sampler2D uNormA,uNormB,uNormC;uniform vec3 uSunDir,uShallow,uDeep,uSun,uHorizonCol;uniform float uWaveN,uFoam,uSSS,uSSSPow;uniform vec3 uSSSCol;
      varying vec3 vWorld;varying vec3 vView;varying vec2 vSlope;varying float vWaveH;
      vec2 sn(sampler2D t,vec2 uv){return texture2D(t,uv).xy*2.0-1.0;}
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
        float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
        return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
      void main(){
        vec2 p=vWorld.xz;
        vec2 d1=sn(uNormA,p*0.0431+vec2(uTime*0.021,uTime*0.013));
        vec2 d2=sn(uNormB,p*0.0177-vec2(uTime*0.0107,uTime*0.0163));
        vec2 d3=sn(uNormC,p*0.0833+vec2(-uTime*0.0241,uTime*0.0089));
        vec3 N=normalize(vec3((d1.x+d2.x+d3.x*0.7) - vSlope.x*uWaveN, 6.0, (d1.y+d2.y+d3.y*0.7) - vSlope.y*uWaveN));
        vec3 V=normalize(vView);
        float fres=clamp(0.03+0.97*pow(1.0-max(0.0,dot(V,N)),3.5),0.0,1.0);
        float depthF=pow(max(0.0,dot(V,vec3(0.0,1.0,0.0))),0.55);
        vec3 base=mix(uDeep,uShallow,depthF);
        vec3 col=mix(base,uHorizonCol,fres);
        {
          float back=pow(max(0.0, dot(V, -normalize(uSunDir))), uSSSPow);
          float thin=smoothstep(0.15, 2.2, vWaveH + length(vSlope)*2.5);
          col += uSSSCol*(uSSS*back*thin);
        }
        float sunSpec=pow(max(0.0,dot(reflect(-V,N),normalize(uSunDir))),140.0);
        col+=uSun*sunSpec*1.8;
        float crest=smoothstep(0.72, 2.15, vWaveH + length(vSlope)*4.2);
        float fb = vnoise(p*0.85 + vec2(uTime*0.33,-uTime*0.21))*0.52 + vnoise(p*2.20 - vec2(uTime*0.48, uTime*0.29))*0.32;
        float bub=smoothstep(0.46, 0.86, fb);
        float distFade=1.0 - smoothstep(150.0, 640.0, length(vView));
        float foam=clamp(crest*uFoam*bub*(0.28+0.72*distFade),0.0,0.88);
        col=mix(col, vec3(0.86,0.91,0.95), foam);
        gl_FragColor=vec4(col,mix(0.7,0.98,max(fres,foam)));
      }`,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(700, 700, 140, 140).rotateX(-Math.PI/2), mat);
  mesh.renderOrder = -1;
  scene.add(mesh);
  return { mat, mesh, update(dt){ mat.uniforms.uTime.value += dt; } };
}
const ocean = buildRealOcean();

// ══ 실제 게임 랜드마크: Sea Keep "Lonely Watcher"(modules/seakeeptest.js와 동일 FBX+텍스처) — 섬 가운데 라군 위에 배치 ══
const SEAKEEP = REAL + 'seakeep/';
function seakeepMaterialsOf(mesh){ return (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).filter(Boolean); }
function seakeepIsBackdrop(mesh){
  // 원본 FBX에 딸려오는 자체 하늘/바다 메시 제거 — 이 대시보드는 이미 실제 water.js 바다를 쓰고 있어서 겹치면 안 됨.
  // ★사령관 지적(2026-08-08, "바다는 빼야함"): seakeeptest.js 원 로직은 mesh 자신의 이름만 검사한다.
  //   실측(strings) 결과 이 FBX의 "Sea" Model/Material 노드가 부모 그룹에 붙어 있어(자식 메시 이름은 빈값/generic)
  //   원 로직으로는 안 걸러졌다 — 부모 체인 이름까지 전부 검사하도록 보강.
  const nameParts = [mesh.name];
  let p = mesh.parent;
  while (p) { nameParts.push(p.name); p = p.parent; }
  for (const mat of seakeepMaterialsOf(mesh)) nameParts.push(mat.name, mat.map && mat.map.name, mat.alphaMap && mat.alphaMap.name);
  const label = nameParts.filter(Boolean).join(' ');
  if (/(^|[_.\s-])(sea|sky|ocean|water)([_.\s-]|$)/i.test(label) || /sky\s*dome|skydome|sea\s*(plane|mesh|surface)|ocean\s*(plane|mesh|surface)/i.test(label)) return true;
  // 보강: 이름이 안 걸려도 "아주 납작하고 넓은 평면"이면 하늘/바다 백드롭으로 간주(형태 기반 안전망).
  const bb = new THREE.Box3().setFromObject(mesh);
  const sz = new THREE.Vector3(); bb.getSize(sz);
  const horiz = Math.max(sz.x, sz.z);
  if (horiz > 0 && sz.y / horiz < 0.02 && horiz > 50) return true;
  return false;
}
function seakeepTuneMaterial(m){
  // ★섬(CPT_Island)과 같은 legacy FBX diffuse=black 증상 — seakeeptest.js와 동일한 보정(원본 색감 유지, 밝기만 정규화).
  if (m.map) { m.map.colorSpace = THREE.SRGBColorSpace; if (m.color) m.color.setRGB(1.35, 1.35, 1.35); }
  if (m.emissiveMap) m.emissiveMap.colorSpace = THREE.SRGBColorSpace;
  if (m.emissive) m.emissive.set(0x000000);
  if ('opacity' in m) m.opacity = 1;
  if ('metalness' in m) m.metalness = 0;
  if ('roughness' in m) m.roughness = Math.max(0.72, m.roughness || 0);
  if ('shininess' in m) m.shininess = Math.min(18, m.shininess ?? 18);
  m.side = THREE.DoubleSide;
  if (m.alphaMap) { m.transparent = false; m.alphaTest = Math.max(m.alphaTest || 0, 0.35); }
  else { m.transparent = false; m.alphaTest = 0; }
  m.needsUpdate = true;
}
async function loadSeaKeepLandmark(){
  const loader = new FBXLoader();
  loader.setResourcePath(SEAKEEP + 'textures/');
  const root = await new Promise((res, rej) => loader.load(SEAKEEP + 'source/Stronghold.fbx', res, undefined, rej));
  root.name = 'SeaKeep_LonelyWatcher';
  root.updateWorldMatrix(true, true); // Box3 안전망이 정확한 크기를 보게 traverse 전에 먼저 갱신

  const removed = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    if (seakeepIsBackdrop(o)) { removed.push(o); return; }
    seakeepMaterialsOf(o).forEach(seakeepTuneMaterial);
    o.castShadow = true; o.receiveShadow = true;
  });
  removed.forEach(o => o.parent && o.parent.remove(o));

  root.updateWorldMatrix(true, true);
  let box = new THREE.Box3().setFromObject(root);
  const raw = box.getSize(new THREE.Vector3());
  const span = Math.max(raw.x, raw.z) || 1;
  // ★진짜 진짜 근본 원인(2026-08-08, 여섯 번째): ATOLL_RADIUS*0.62(지름 105유닛)는 이 섬(군도형, 큰 섬 하나가
  //   아니라 작은 바위섬들이 흩어진 형태)의 어떤 개별 섬보다도 컸다 — 중심을 아무리 잘 잡아도 절반(52유닛)이
  //   반드시 물에 걸렸다. "키워달라"는 지시와 "물 밖으로 빼라"는 지시가 이 지형에서는 충돌해서, 실제로 안전하게
  //   들어갈 수 있는 크기(ACTIVITY_RADIUS 활동권 안에서 검증된 크기)로 낮춘다.
  const targetSpan = ACTIVITY_RADIUS * 1.0;
  root.scale.setScalar(targetSpan / span);
  root.updateWorldMatrix(true, true);
  box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  // ★진짜 원인 발견(2026-08-08, 사령관이 세 번 지적한 뒤에야 찾음): (x,z)는 매번 제대로 육지를 찾고 있었는데
  //   Y좌표를 실제 지형 높이가 아니라 "무조건 해수면(0)"으로 고정해놔서, 육지가 해수면보다 조금이라도 낮은
  //   지형이면 모델 밑동이 물 속에 잠긴 것처럼 보였다(x,z만 확인하고 y는 안 본 게 근본 실수). ANCHOR 근처의
  //   실제 지형 높이(groundAt)를 구해 거기에 맞춘다.
  // 본섬(-100,0 근방)과 옆 산(100,0 근방) 사이 전체를 훑어 실제로 가장 높은 지점(=산 능선/봉우리)을 찾는다.
  const keepSpot = findHighestPoint(0, 0, 140, 26);
  const keepGroundY = keepSpot.y;
  root.position.x += keepSpot.x - center.x;
  root.position.z += keepSpot.z - center.z;
  root.position.y += (keepGroundY != null ? keepGroundY : 0) - box.min.y; // 밑동을 실제 지형 표면에 맞춘다
  scene.add(root);
  console.log('[hearthling] Sea Keep "Lonely Watcher" 랜드마크 배치 완료(실제 육지 위, 백드롭 제거 '+removed.length+'개)');

// 중앙 건설 현장의 발치 클리어런스(나무/광물 스폰 금지 반경과 동일값) — 워커도 이 안쪽엔 안 선다.
const BUILD_CLEAR_R = 14;
function hashPos(id){
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  const a = (h % 1000)/1000 * Math.PI*2;
  // ★22차: 고정 상수(ACTIVITY_RADIUS=42)로 흩뿌리던 걸 카메라가 실제로 담는 반경(FRAME_R) 기준으로 교체 —
  //   이전엔 최대 37.8까지 나가서 워커가 전원 프레임 밖에 서 있었다. 배치 후 투영으로 직접 확인하고,
  //   그래도 밖이면 반경을 줄여가며 재시도한다(육지 판정 findLandNear가 좌표를 밀어낼 수 있어서 안전망 필요).
  const rMax = FRAME_R;
  const rMin = Math.min(rMax * 0.55, BUILD_CLEAR_R);
  const r = rMin + (h % 5000)/5000 * Math.max(0, rMax - rMin);
  // ANCHOR(카메라 클로즈업 기준점) 주변에서만 스폰 — 환초 전체가 아니라 실제 화면에 보이는 범위에 모이게.
  // 원이 아니라 화면 모양에 맞춘 타원: 화면 좌우(CAM_RIGHT)는 r, 깊이(CAM_FWD)는 r*DEPTH_GAIN.
  const p = frameEllipse(a, r);
  const land = landInFrame(p.x, p.z);
  return { x: land.x, z: land.z, h };
}
// ANCHOR 기준, 화면 좌우/깊이 축으로 늘린 타원 위의 한 점(월드 XZ).
function frameEllipse(angle, r){
  const cx = Math.cos(angle) * r, cz = Math.sin(angle) * r * DEPTH_GAIN;
  return {
    x: ANCHOR.x + CAM_RIGHT.x * cx + CAM_FWD.x * cz,
    z: ANCHOR.z + CAM_RIGHT.z * cx + CAM_FWD.z * cz
  };
}
// 육지 위이면서 화면 안인 좌표로 보정 — 밖이면 ANCHOR 쪽으로 당겨가며 재시도(findLandNear가 좌표를 밖으로
// 밀어낼 수 있어서 육지 판정만으로는 프레임 안을 보장 못 한다).
function landInFrame(x, z){
  let p = findLandNear(x, z);
  for (let k=0; k<6 && !inFrame(p.x, p.z); k++){
    x = ANCHOR.x + (x - ANCHOR.x) * 0.78;
    z = ANCHOR.z + (z - ANCHOR.z) * 0.78;
    p = findLandNear(x, z);
  }
  return p;
}

// 실측 섬 반경(ISLAND_RADIUS)의 비율로 좌표를 잡는다 — 실물 FBX 크기를 로드 전엔 몰라서 절대좌표 대신 비율 사용.
let NODES = null;
function computeNodes(){
  // ★사령관 지시(2026-08-08 "만들어질 집이 가운데 구도로 와야하고 다른 에이전트들이 조금더 멀리서보여야지"):

  //   고정 — 화면 중앙에 오도록. base/ore/forage는 반대로 더 바깥쪽으로 밀어내 "중앙의 건물 + 그 뒤로
  //   멀찍이 흩어져 일하는 워커들"처럼 읽히게 한다.
  // ★22차: base 노드도 ACTIVITY_RADIUS*0.95(=40, 프레임 밖)에서 FRAME_R 기준으로 교체 —
  //   "조금 더 멀리서 보이게"라는 의도는 유지하되 화면 안에서 가장 먼 쪽에 둔다.
  const A = ANCHOR;
  const raw = {
    // ★24차: base가 한 점뿐이라 보고하러 가는 워커들이 같은 자리에 겹쳤다(활성 세션까지 워커로 잡으면서
    //   워커 수가 3→6으로 늘어난 뒤 두드러졌다). 화면 위쪽에 세 자리로 벌린다.
    base:  [frameEllipse(Math.PI*0.5, FRAME_R*0.9), frameEllipse(Math.PI*0.72, FRAME_R*0.8), frameEllipse(Math.PI*0.28, FRAME_R*0.8)],
    build: [{x:A.x, z:A.z}, {x:A.x, z:A.z}],
  };
  NODES = { ore: [], forage: [] };
  for (const key in raw) NODES[key] = raw[key].map(p => { const l = landInFrame(p.x, p.z); return { x:l.x, z:l.z }; });
}
// 중앙(건설 현장) 근처의 실제 배치 나무/광물은 제외하고, 그보다 바깥쪽 것들 중 가장 가까운 것을 워커 목적지로
// 삼는다 — 그래야 채집/벌목 워커가 화면 중앙(건물)을 침범하지 않고 그 뒤쪽에서 일하는 것처럼 보인다.
// (22차부터 그 반경은 buildRealEnvironment 안에서 FRAME_R·BUILD_CLEAR_R 기준으로 계산한다)
// 건설 현장(NODES.build) 발치에 나무/광물이 겹쳐서 자라는 것 방지(사령관 "건물 바로 앞에 석탄같은게있어" — 건물
// 실측 대각선 반경보다 넉넉한 클리어런스, 건물을 키운 뒤(buildSiteHeight 6→11) 14m로 같이 확대).
// computeNodes()가 먼저 실행돼 NODES.build가 이미 채워진 뒤에 호출됨.
function tooCloseToBuildSite(x, z, r){
  if (!NODES || !NODES.build) return false;
  return NODES.build.some(p => { const dx=x-p.x, dz=z-p.z; return dx*dx+dz*dz < r*r; });
}
// ★사령관 지적(2026-08-08 "화면이 답답해보임/구도가 이상함"): 시드 고정 PRNG라 매번 똑같은 나무가 카메라
//   기본 시점의 시선(camera→anchor 직선) 위에 정확히 겹쳐서(실측 5.3°off, 47유닛 거리 — 캔버스 절반을 가리는 크기)
//   재현성 있게 화면을 막고 있었다. loadHomeIsland()의 fitCameraToAnchor()가 이미 실행돼 camera.position/
//   controls.target이 확정된 뒤에 나무/광물 배치가 돌아가므로, 그 시선 회랑만 살짝 비워서 해결한다(회랑 밖은
//   그대로 원본 알고리즘 결과 유지 — 섬 전체를 성기게 만드는 게 아니라 카메라 정면만 청소).
function tooCloseToSightline(x, z, r){
  const ax = camera.position.x, az = camera.position.z, bx = controls.target.x, bz = controls.target.z;
  const dx = bx-ax, dz = bz-az, len2 = dx*dx+dz*dz || 1;
  let t = ((x-ax)*dx + (z-az)*dz) / len2; t = Math.max(0, Math.min(1, t));
  const px = ax+t*dx, pz = az+t*dz, ddx = x-px, ddz = z-pz;
  return (ddx*ddx+ddz*ddz) < r*r;
}

    let src = null; g.scene.updateMatrixWorld(true); g.scene.traverse(o => { if (o.isMesh && !src) src = o; });
    if (!src) return;
    let geo = src.geometry.index ? src.geometry.toNonIndexed() : src.geometry.clone();
    src.updateMatrixWorld(true); geo.applyMatrix4(src.matrixWorld);
    geo.computeBoundingBox(); let bb = geo.boundingBox; const s = 1/((bb.max.y-bb.min.y)||1);
    geo.scale(s, s, s); geo.computeBoundingBox(); bb = geo.boundingBox; geo.translate(0, -bb.min.y, 0);
    const mat = Array.isArray(src.material) ? src.material[0] : src.material;
    mat.side = THREE.DoubleSide; if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace; mat.needsUpdate = true;
    protos.push({ name, geo, mat });
  }).catch(e => console.warn('[hearthling] tree proto fail', name, e))));
  return protos;
}

// environment.js placeTrees()와 동일 알고리즘: 산 회피 + 수면 위 + 완만한 경사(face normal) + 아틀라스 초록 판정.
function placeTreesReal(protos, target, centerX, centerZ, radius){
  let seed = 20260629 >>> 0;
  const rnd = () => { seed = (seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const placedList = [];
  let tries = 0, placed = 0;
  while (placed < target && tries < target*12) {
    tries++;
    const a = rnd()*6.283, rr = Math.sqrt(rnd())*radius;
    const x = centerX + Math.cos(a)*rr, z = centerZ + Math.sin(a)*rr;
    if (MOUNTAINS.some(m => { const dx=x-m.x, dz=z-m.z; return dx*dx+dz*dz < (m.r*0.95)*(m.r*0.95); })) continue;
    // ★22차: 나무 높이가 15~30이라 활동권 안에 서면 워커를 통째로 가린다(실측 스샷에서 워커 하나가 나무에
    //   완전히 덮였다). 활동권(카메라가 담는 반경) 안쪽은 잔디만 남기고 나무는 그 바깥에만 심는다 —
    //   화면 가장자리로는 여전히 숲이 보여서 허전해지지 않는다.
    //   비우는 폭은 방향에 따라 다르다 — 카메라와 워커 사이(화면 아래쪽)에 선 나무만 시야를 막고,
    //   카메라에서 먼 쪽(화면 위쪽)의 나무는 오히려 배경을 채워주고 채집 목적지로도 쓰인다.
    {
      const rx = x-ANCHOR.x, rz = z-ANCHOR.z;
      const fwd = rx*CAM_FWD.x + rz*CAM_FWD.z; // +면 카메라에서 먼 쪽, -면 카메라 쪽
      const clear = Math.max(BUILD_CLEAR_R, FRAME_R * (fwd < 0 ? 1.6 : 0.8));
      if (rx*rx + rz*rz < clear*clear) continue;
    }
    if (tooCloseToBuildSite(x, z, 14) || tooCloseToSightline(x, z, 13)) continue;
    const h = groundHit(x, z); if (!h) continue;
    if (h.point.y < WATER_LEVEL+0.5) continue;
    if (h.face) { const nr = h.face.normal.clone().transformDirection(h.object.matrixWorld); if (nr.y < 0.85) continue; }
    if (!isGreenAt(h)) continue;
    const dx = x-centerX, dz = z-centerZ; if (dx*dx+dz*dz < 64) continue;
    const proto = protos[(rnd()*protos.length)|0]; if (!proto) continue;
    const H = 15 + Math.pow(rnd(),1.1)*15; // environment.js와 동일 수식(실제 게임 나무 높이)
    // ★22차: 거리 기준 클리어런스만으로는 근경 나무를 다 못 거른다 — 같은 거리라도 카메라를 눕힌 뒤로는
    //   화면에서 훨씬 크게 잡힌다. 실제로 "화면 높이의 몇 %를 먹는지"로 직접 판정해서, 시야를 덮는
    //   근경 나무만 스킵한다(프레임 밖 나무는 아무리 커도 무관하므로 건드리지 않는다).
    if (inFrame(x, z, 1.0)) {
      const camD = Math.max(1, camera.position.distanceTo(new THREE.Vector3(x, h.point.y, z)));
      const screenSpanY = 2 * camD * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
      if (H / screenSpanY > 0.30) continue; // 화면 높이의 30% 넘게 먹는 나무는 배치하지 않음
    }
    const mesh = new THREE.Mesh(proto.geo, proto.mat);
    mesh.scale.setScalar(H); mesh.position.set(x, h.point.y, z); mesh.rotation.y = rnd()*6.283;
    mesh.castShadow = true; scene.add(mesh);
    // 나무도 마찬가지 — 밑동 반경만큼 앞에 서야 도끼질이 나무를 향한다(사령관 "벌목도 마찬가지").
    //   캐노피(잎)까지 재면 반경이 과하게 커지므로 줄기 굵기 기준으로 잡는다(높이 H에 비례).
    placedList.push({ x, z, y: h.point.y, r: Math.max(0.8, H * 0.055), mesh });
    placed++;
  }
  return placedList;
}

// ── 광물 9종: environment.js GEO_SRC/ORES/RARITY 그대로(같은 소스 메시를 색만 바꿔 여러 광종에 재사용) ──
const ORE_GEO_SRC = {
  ruda:    { type:'objmtl', dir: REAL+'ore/ruda/', obj:'Ruda_final.obj', mtl:'Ruda_final.mtl' },
  crystal: { type:'obj', dir: REAL+'ore/', obj:'ChristalUV.obj' },
  desert:  { type:'obj', dir: REAL+'ore/', obj:'Rocky_The_LowPoly_Rock.obj' },
  orerock: { type:'fbx', url: REAL+'ore/PT_Ore_Rock_01.fbx' },
};
const ORES = [
  {name:'돌',    src:'desert',  lp:{color:0x9a9286, metalness:0,    roughness:0.95}},
  {name:'석탄',  src:'orerock', lp:{color:0x202227, metalness:0.05, roughness:0.7}},
  {name:'철광석',src:'ruda',    lp:{color:0x6b7686, shiny:true, metalness:0.72, roughness:0.42, clearcoat:0.4, emissive:0x202a36, emissiveIntensity:0.08}},
  {name:'구리',  src:'ruda',    lp:{color:0xc16a38, shiny:true, metalness:0.85, roughness:0.34, clearcoat:0.5, emissive:0x3a1c0c, emissiveIntensity:0.08}},
  // ★limonite 원본(19MB obj)은 environment.js도 HEAVY(5000삼각형↑)면 무조건 orerock으로 자동 치환 — 로드만 하고 버려질 걸 알아서 처음부터 안 받고 바로 orerock 사용(결과 동일).
  {name:'주석',  src:'orerock', lp:{color:0x9ba2aa, metalness:0.55, roughness:0.5}},
  {name:'은',    src:'ruda',    lp:{color:0xd6dade, shiny:true, metalness:0.95, roughness:0.2, clearcoat:0.6}},
  {name:'코발트',src:'crystal', lp:{color:0x2f55d4, shiny:true, metalness:0.6,  roughness:0.28, clearcoat:0.9, emissive:0x162f8c, emissiveIntensity:0.18}},
  {name:'금',    src:'ruda',    lp:{color:0xe6b73a, shiny:true, metalness:0.95, roughness:0.22, clearcoat:0.6, emissive:0x4a3408, emissiveIntensity:0.12}},
  {name:'보석',  src:'crystal', lp:{color:0xd83a5e, shiny:true, metalness:0.15, roughness:0.1, clearcoat:1, emissive:0x7a1830, emissiveIntensity:0.2}},
];
const ORE_RARITY_NORMAL = { 돌:24, 석탄:8, 철광석:7, 구리:5, 주석:4, 은:2.5, 코발트:1.5, 금:1, 보석:0.6 }; // CFG.mid.oreW='normal'

function matFromLp(lp){
  const col = new THREE.Color(lp.color ?? 0x8a8378); let mat;
  if (lp.shiny) mat = new THREE.MeshPhysicalMaterial({ color:col, flatShading:true, metalness:lp.metalness??0.8, roughness:lp.roughness??0.22, clearcoat:lp.clearcoat??1, clearcoatRoughness:0.15 });
  else mat = new THREE.MeshStandardMaterial({ color:col, flatShading:true, roughness:lp.roughness??0.9, metalness:lp.metalness??0.05 });
  if (lp.emissive != null) { mat.emissive = new THREE.Color(lp.emissive); mat.emissiveIntensity = lp.emissiveIntensity ?? 0.1; }
  mat.side = THREE.DoubleSide;
  return mat;
}
function ensureAttrs(g){
  if (g.index) g = g.toNonIndexed();
  for (const k of Object.keys(g.attributes)) { if (k !== 'position' && k !== 'normal') g.deleteAttribute(k); }
  if (!g.getAttribute('normal')) g.computeVertexNormals();
  return g;
}
function toSingleGeo(root, target){
  root.updateWorldMatrix(true, true);
  const gs = [];
  root.traverse(m => { if (m.isMesh) { let g = m.geometry.clone(); g.applyMatrix4(m.matrixWorld); gs.push(ensureAttrs(g)); } });
  let geo = gs.length > 1 ? mergeGeometries(gs, false) : gs[0];
  geo.computeBoundingBox();
  const sz = geo.boundingBox.getSize(new THREE.Vector3()), c = geo.boundingBox.getCenter(new THREE.Vector3());
  const s = target / (Math.max(sz.x, sz.y, sz.z) || 1);
  geo.translate(-c.x, -c.y, -c.z); geo.scale(s, s, s);
  geo.computeVertexNormals(); geo.computeBoundingBox(); geo.translate(0, -geo.boundingBox.min.y, 0);
  return geo;
}
async function loadOreRaw(it){
  if (it.type === 'objmtl') {
    const mtl = await new MTLLoader().setPath(it.dir).loadAsync(it.mtl); mtl.preload();
    return await new OBJLoader().setMaterials(mtl).setPath(it.dir).loadAsync(it.obj);
  }
  if (it.type === 'obj') return await new OBJLoader().setPath(it.dir).loadAsync(it.obj);
  return await new FBXLoader().loadAsync(it.url);
}
async function loadOreGeoCache(){
  const cache = {};
  for (const k in ORE_GEO_SRC) { try { cache[k] = toSingleGeo(await loadOreRaw(ORE_GEO_SRC[k]), 3.0); } catch (e) { console.warn('[hearthling] ore geo fail', k, e); } }
  for (const ore of ORES) { ore.geo = cache[ore.src] || null; ore.mat = matFromLp(ore.lp); }
}
function pickOre(rnd){
  const weights = ORES.map(o => ORE_RARITY_NORMAL[o.name] || 0);
  const sum = weights.reduce((s,w)=>s+w, 0);
  let t = rnd()*sum;
  for (let i=0;i<ORES.length;i++) { if ((t -= weights[i]) <= 0) return ORES[i]; }
  return ORES[0];
}
// environment.js buildOres()와 동일: 산 링(oreRing) + 섬 전역 산개(oreExtra), 희귀도 가중치로 광종 추첨.
function placeOresReal(centerX, centerZ, radius){
  let seed = 20260629 >>> 0;
  const rnd = () => { seed = (seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const list = [];
  function placeOre(x, z){
    if (tooCloseToBuildSite(x, z, 14) || tooCloseToSightline(x, z, 6)) return null;
    const h = groundHit(x, z); if (!h || h.point.y < WATER_LEVEL+0.3) return null;
    const ore = pickOre(rnd); if (!ore.geo) return null;
    const s = 0.7 + rnd()*0.7;
    const mesh = new THREE.Mesh(ore.geo, ore.mat.clone());
    mesh.scale.setScalar(s); mesh.position.set(x, h.point.y - 0.1, z); mesh.rotation.y = rnd()*6.283;
    mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
    mesh.userData.ore = ore.name;
    // ★사령관 지적(2026-08-10) "곡괭이질을 하는 게 아니라 돌 속으로 들어감": 워커가 노드 **중심 좌표**로
    //   걸어가서 광물 메시 안에 파묻혔다. 실제 메시 반경을 재서 그만큼 앞에 서게 한다.
    const ob = new THREE.Box3().setFromObject(mesh);
    const osz = new THREE.Vector3(); ob.getSize(osz);
    const entry = { x, z, y: h.point.y, name: ore.name, r: Math.max(osz.x, osz.z) * 0.5, mesh };
    list.push(entry);
    return entry;
  }
  for (const m of MOUNTAINS) {
    for (let i=0;i<ENV_CFG.oreRing;i++){
      const a = (i/ENV_CFG.oreRing)*6.283 + rnd()*0.35, rr = m.r*(0.85+rnd()*0.55);
      placeOre(m.x+Math.cos(a)*rr, m.z+Math.sin(a)*rr);
    }
  }
  for (let i=0, tries=0; i<ENV_CFG.oreExtra && tries<ENV_CFG.oreExtra*18; tries++){
    const a = rnd()*6.283, rr = Math.sqrt(rnd())*radius*0.85;
    if (placeOre(centerX+Math.cos(a)*rr, centerZ+Math.sin(a)*rr)) i++;
  }
  return list;
}

// ── 잔디: environment.js buildGrass()와 동일 셰이더/인스턴싱, 범위만 본섬(ATOLL_ROOT) bbox 그대로 ──
let grassMat = null; const grassChunks = [];
// ★2.4배는 확대해서 보면 진하고 좋았지만 사령관이 줌아웃한 전체 섬 뷰에서 "징그럽다"(반점처럼 보임)고
//   지적 — 이제 바닥 자체가 초록으로 칠해지므로(위 loadHomeIsland 아틀라스 보정) 블레이드는 디테일만
//   더하면 되니 과한 확대는 줄인다.
const GRASS_SCALE_BOOST = 1.5;
function buildGrassReal(){
  const bb = new THREE.Box3().setFromObject(ATOLL_ROOT);
  const minX=bb.min.x, maxX=bb.max.x, minZ=bb.min.z, maxZ=bb.max.z;
  const GW = 120, cx=(maxX-minX)/GW, cz=(maxZ-minZ)/GW;
  const gyA = new Float32Array(GW*GW), gok = new Uint8Array(GW*GW);
  for (let i=0;i<GW;i++) for (let j=0;j<GW;j++){
    const x = minX+(i+0.5)*cx, z = minZ+(j+0.5)*cz;
    const h = groundHit(x, z); let ok=0, y=0;
    if (h && h.point.y > WATER_LEVEL+0.5 && isGreenAt(h)) {
      y = h.point.y;
      const nr = h.face ? h.face.normal.clone().transformDirection(h.object.matrixWorld) : null;
      ok = (!nr || nr.y > 0.78) ? 1 : 0;
    }
    gyA[i*GW+j]=y; gok[i*GW+j]=ok;
  }
  const BL=40, RAD=1.7, segs=3; const pos=[],aH=[],idx=[]; let vb=0; let r=98765; const rr=()=>{ r=(r*9301+49297)%233280; return r/233280; };
  for (let b=0;b<BL;b++){
    const a=rr()*6.283, rad=Math.sqrt(rr())*RAD, bx=Math.cos(a)*rad, bz=Math.sin(a)*rad;
    const H=0.21+rr()*0.18, w=0.05*(1+rr()*0.5), az=rr()*6.283, ca=Math.cos(az), sa=Math.sin(az), lean=0.05+rr()*0.16;
    for (let i=0;i<=segs;i++){ const t=i/segs, y=t*H, ww=w*(1-t*0.85), bzz=t*t*lean;
      for (const s of [-1,1]){ const lx=s*ww; pos.push(bx+lx*ca-bzz*sa, y, bz+lx*sa+bzz*ca); aH.push(t); } }
    for (let i=0;i<segs;i++){ const k=vb+i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); } vb+=(segs+1)*2;
  }
  const posAttr=new THREE.Float32BufferAttribute(pos,3), aHAttr=new THREE.Float32BufferAttribute(aH,1), idxAttr=new THREE.Uint16BufferAttribute(idx,1);
  grassMat = new THREE.ShaderMaterial({ side:THREE.DoubleSide, uniforms:{ uTime:{value:0}, uCamPos:{value:new THREE.Vector3()}, uLight:{value:1} },
    vertexShader:`uniform float uTime; uniform vec3 uCamPos; attribute vec3 iOffset; attribute float iAngle; attribute float iScale; attribute float iTint; attribute float aH; varying float vH; varying float vT;
      void main(){ vH=aH; vT=iTint; float s=sin(iAngle),c=cos(iAngle); vec3 q=position*iScale; q=vec3(q.x*c-q.z*s,q.y,q.x*s+q.z*c);
        vec4 wb=modelMatrix*vec4(iOffset,1.0); float camd=distance(uCamPos.xz, wb.xz);
        float hs=mix(0.4,1.0,smoothstep(2.0,8.0,camd));
        q.y*=hs;
        float w=sin(uTime*1.3+iOffset.x*0.4+iOffset.z*0.5)+0.4*sin(uTime*2.3+iOffset.x*0.8); float bend=w*0.12*aH*aH*hs; q.x+=bend*c; q.z+=bend*s+bend*0.3;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(q+iOffset,1.0); }`,
    fragmentShader:`varying float vH; varying float vT; uniform float uLight;
      void main(){ vec3 base=vec3(0.25,0.33,0.14), tip=vec3(0.42,0.50,0.20); vec3 col=mix(base,tip,vH); col*=0.95+vT*0.1; col*=0.82+0.18*vH;
        col*=uLight;
        gl_FragColor=vec4(col,1.0); }` });
