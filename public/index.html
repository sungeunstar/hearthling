  for (let x=minX;x<maxX;x+=STEP) for (let z=minZ;z<maxZ;z+=STEP){
    const jx=x+(Math.random()-0.5)*STEP, jz=z+(Math.random()-0.5)*STEP;
    const i=Math.min(GW-1,Math.max(0,(jx-minX)/cx|0)), j=Math.min(GW-1,Math.max(0,(jz-minZ)/cz|0));
    if (!gok[i*GW+j]) continue;
    const ng=Math.sin(jx*0.055)*Math.sin(jz*0.05)+Math.sin(jx*0.12+jz*0.08)*0.6;
    if (ng < -0.78) continue;
    const ck=Math.floor(jx/CHUNK), cl=Math.floor(jz/CHUNK), key=ck+','+cl;
    let bk=buckets.get(key); if (!bk){ bk={ ccx:(ck+0.5)*CHUNK, ccz:(cl+0.5)*CHUNK, off:[],ang:[],scl:[],tnt:[] }; buckets.set(key,bk); }
    // ★사령관 "게임 본편 섬 다시 가서 확인해봐"(2026-08-08) — 직접 codex/tomob을 켜서 실측: 실제 게임은
    //   1인칭/3인칭 근접 시점이라 잔디 블레이드(H 0.21~0.39, w 0.05~0.075) 하나하나가 화면을 채워 초록이
    //   빽빽해 보이지만, 이 대시보드는 훨씬 먼 쿼터뷰 카메라(ACTIVITY_RADIUS*1.65≈69유닛)라 같은 블레이드가
    //   화면상 실폭 1~2px로 쪼그라들어 초록이 거의 안 보이고 밑에 깔린 회색/황토 아틀라스만 두드러졌다.
    //   텍스처·조명·배치 알고리즘은 이미 원본과 일치 확인함 — 남은 차이는 순수 "관측 거리" 문제이므로
    //   블레이드 자체 스케일을 이 카메라 거리에 맞게 키운다(배치 위치/개수/색은 원본 그대로, 크기만 보정).
    bk.off.push(jx-bk.ccx, gyA[i*GW+j], jz-bk.ccz); bk.ang.push(rr()*6.283); bk.scl.push((0.85+rr()*0.5) * GRASS_SCALE_BOOST); bk.tnt.push(rr());
  }
  for (const bk of buckets.values()){
    const n=bk.ang.length; if (!n) continue;
    const g=new THREE.InstancedBufferGeometry(); g.setAttribute('position',posAttr); g.setAttribute('aH',aHAttr); g.setIndex(idxAttr);
    g.setAttribute('iOffset', new THREE.InstancedBufferAttribute(new Float32Array(bk.off),3));
    g.setAttribute('iAngle', new THREE.InstancedBufferAttribute(new Float32Array(bk.ang),1));
    g.setAttribute('iScale', new THREE.InstancedBufferAttribute(new Float32Array(bk.scl),1));
    g.setAttribute('iTint', new THREE.InstancedBufferAttribute(new Float32Array(bk.tnt),1));
    g.instanceCount=n; g.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,0.4,0), CHUNK*0.75+RAD+0.8);
    const mesh=new THREE.Mesh(g,grassMat); mesh.position.set(bk.ccx,0,bk.ccz); mesh.frustumCulled=true; scene.add(mesh); grassChunks.push(mesh);
  }
  console.log('[hearthling] 잔디 패치', grassChunks.length, '청크');
}

async function buildRealEnvironment(){
  const [treeProtos] = await Promise.all([ loadTreeProtos(), loadOreGeoCache() ]);
  const treeList = placeTreesReal(treeProtos, ENV_CFG.trees, LAGOON_CENTER.x, LAGOON_CENTER.z, ATOLL_RADIUS);
  const oreList = placeOresReal(LAGOON_CENTER.x, LAGOON_CENTER.z, ATOLL_RADIUS);
  buildGrassReal();
  console.log('[hearthling] environment.js 이식 배치 완료 — 나무 '+treeList.length+', 광물 '+oreList.length+', 산 '+MOUNTAINS.length);

  // 노드 객체는 **공유 인스턴스**여야 한다 — carve/broken 상태가 어디서 참조하든 같이 반영돼야 한다.
  oreList.forEach(o => Object.assign(o, { r:o.r||1.2 }));
  treeList.forEach(t => Object.assign(t, { r:t.r||1.0 }));
  // 설계 §2 — 흩어진 자원 중 그때그때 고르던 방식을 버리고 **작업장 구역**으로 모은다.
  layoutWorkSites(oreList, treeList);
}

// ══ 채광/벌목 파괴 — 실제 게임 modules/mine.js 이식(CSG carve + Rapier 파편) ══
//   원본 상수 그대로: CARVE_MAX 8회, 구멍 반경 0.2. 곡괭이가 닿을 때마다 진짜로 부피가 깎이고,
//   8회째에 조각나면서 광물색 파편이 물리로 튄다. 나무도 같은 방식으로 도끼질마다 패인다.
// 원본 mine.js는 CARVE_R=0.2 — 다만 그건 곡괭이가 화면을 채우는 1인칭 기준이고, 이 대시보드는 훨씬 먼
// 쿼터뷰라 같은 구멍이 몇 px로 뭉개져 "패이는 게 안 보인다"(19차 잔디 크기와 같은 관측 거리 문제).
// 횟수(CARVE_MAX 8)는 원본 그대로 두고 구멍 반경만 이 거리에서 읽히게 키운다.
const CARVE_MAX = 8, CARVE_R = 0.38;
const _csgEval = new Evaluator(); _csgEval.useGroups = false;
// CSG는 두 브러시의 **속성 집합이 정확히 같아야** 동작한다. 광물은 OBJ/FBX 출신이라 uv가 없는 경우가 있어
// (실패 로그: "Cannot read properties of undefined (reading 'array')") position/normal/uv만 남기고 맞춰준다.
function normalizeGeoForCSG(geo){
  const g = geo.clone();
  g.morphAttributes = {};
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') g.deleteAttribute(k);
  g.clearGroups();
  return g;
}
const _carveSphereGeo = normalizeGeoForCSG(new THREE.SphereGeometry(0.5, 16, 12));
const debrisList = []; // {mesh, body, bornAt}
// 노드 메시를 CSG가 다룰 수 있는 Brush로 한 번만 승격(원본 mine.js도 Brush로 광맥을 세운다).
function ensureBrush(node){
  if (!node || !node.mesh || node.brush) return node && node.brush;
  const src = node.mesh;
  const b = new Brush(normalizeGeoForCSG(src.geometry), src.material);
  b.position.copy(src.position); b.rotation.copy(src.rotation); b.scale.copy(src.scale);
  b.castShadow = b.receiveShadow = true; b.updateMatrixWorld(true);
  scene.remove(src); scene.add(b);
  node.brush = b; node.carves = 0;
  return b;
}
// 타격 지점 주변을 얕게 갉는다 — 원본과 동일하게 랜덤 오프셋을 줘 같은 자리를 쳐도 매번 새 부피가 깎인다.
function carveNode(node, hitPoint, dir){
  const b = ensureBrush(node);
  if (!b || node.broken) return;
  const sp = CARVE_R * 0.7;
  const center = hitPoint.clone().addScaledVector(dir, CARVE_R * 0.4)
    .add(new THREE.Vector3((Math.random()-0.5)*sp, (Math.random()-0.5)*sp, (Math.random()-0.5)*sp));
  const sb = new Brush(_carveSphereGeo, b.material);
  sb.scale.setScalar(CARVE_R / 0.5); sb.position.copy(center); sb.updateMatrixWorld(true);
  let result;
  try { result = _csgEval.evaluate(b, sb, SUBTRACTION); }
  catch (e) { console.warn('[hearthling] CSG 실패', e && e.message); return; }
  result.material = b.material; result.castShadow = result.receiveShadow = true; result.updateMatrixWorld(true);
  scene.remove(b); scene.add(result); node.brush = result;
  spawnChips(hitPoint, 6, b.material.color);
  node.carves = (node.carves || 0) + 1;
  if (node.carves >= CARVE_MAX) breakNode(node, hitPoint);
}
// ★사령관 지시(2026-08-10) "밑둥 남겨, 광석도 마찬가지" — 실제 게임 mine.js도 광맥을 깨면 그 자리에
//   `PT_Ore_Rock_01_split.fbx` 그루터기를 광물색으로 남긴다(영구, 페이드 없음). 같은 애셋을 그대로 쓴다.
let _splitGeo = null, _splitPending = null;
function loadSplitGeo(){
  if (_splitGeo) return Promise.resolve(_splitGeo);
  if (!_splitPending){
    _splitPending = new FBXLoader().loadAsync(REAL + 'ore/PT_Ore_Rock_01_split.fbx')
      .then(root => { _splitGeo = toSingleGeo(root, 3.0); return _splitGeo; })
      .catch(e => { console.warn('[hearthling] split 그루터기 로드 실패', e); return null; });
  }
  return _splitPending;
}
function spawnOreStump(node, gy, mat){
  loadSplitGeo().then(geo => {
    if (!geo) return;
    const stump = new THREE.Mesh(geo, mat ? mat.clone() : new THREE.MeshStandardMaterial({ color: 0x9a9286 }));
    stump.castShadow = stump.receiveShadow = true;
    stump.scale.setScalar(0.95 * (node.r ? Math.min(1.6, node.r * 0.7) : 1));
    stump.position.set(node.x, gy, node.z);
    stump.rotation.y = Math.random() * Math.PI * 2;
    const sb = new THREE.Box3().setFromObject(stump);
    stump.position.y += gy - sb.min.y + 0.12; // 지면 위로 살짝(묻힘 방지) — 원본과 동일
    scene.add(stump);
    node.stump = stump;
  });
}
// 조각남 — 원본 breakRock과 같은 구성: 본체 제거 + 그루터기 + 칩 폭발 + 물리 파편.
function breakNode(node, p){
  if (node.broken) return;
  node.broken = true; node.brokenAt = performance.now(); // 리스폰 타이머 시작
  const mat = node.brush ? node.brush.material : null;
  const col = mat && mat.color ? mat.color : new THREE.Color(0x9a9286);
  if (node.brush) scene.remove(node.brush);
  spawnChips(p, 20, col);
  const gy = groundAt(node.x, node.z) ?? p.y;
  spawnOreStump(node, gy, mat);
  // 파편이 무한 낙하하지 않게 발치에 지면 대용 collider를 깐다(본편은 실제 지형 collider가 받친다).
  if (physicsWorld && RAPIER && !node.groundBody){
    const gb = physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(node.x, gy - 0.25, node.z));
    physicsWorld.createCollider(RAPIER.ColliderDesc.cuboid(3, 0.25, 3), gb);
    node.groundBody = gb;
  }
  const geo = new THREE.IcosahedronGeometry(0.26, 0);
  for (let i = 0; i < 7; i++){
    const m = new THREE.Mesh(geo, mat ? mat.clone() : new THREE.MeshStandardMaterial({ color: col }));
    const pos = new THREE.Vector3(node.x + (Math.random()-0.5)*0.6, p.y + 0.3, node.z + (Math.random()-0.5)*0.6);
    m.position.copy(pos); m.castShadow = true; scene.add(m);
    let body = null;
    if (physicsWorld && RAPIER){
      body = physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setLinearDamping(0.25).setAngularDamping(0.4));
      physicsWorld.createCollider(RAPIER.ColliderDesc.ball(0.26).setDensity(0.5).setFriction(0.85).setRestitution(0.25), body);
      const ms = body.mass();
      body.applyImpulse({ x:(Math.random()-0.5)*3.0*ms, y:(2.5+Math.random()*2.0)*ms, z:(Math.random()-0.5)*3.0*ms }, true);
      body.applyTorqueImpulse({ x:(Math.random()-0.5)*0.7*ms, y:(Math.random()-0.5)*0.7*ms, z:(Math.random()-0.5)*0.7*ms }, true);
    }
    debrisList.push({ mesh:m, body, bornAt: performance.now() });
  }
}
// 타격 칩(작은 파편 스프레이) — 원본 spawnChips와 같은 역할. 물리 없이 가볍게 포물선.
const chips = [];
const _chipGeo = new THREE.TetrahedronGeometry(0.09, 0);
function spawnChips(p, n, color){
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(_chipGeo, new THREE.MeshStandardMaterial({ color: color || 0x9a9286, roughness:0.9 }));
    m.position.copy(p);
    scene.add(m);
    chips.push({ m, v: new THREE.Vector3((Math.random()-0.5)*3.4, 1.6+Math.random()*2.4, (Math.random()-0.5)*3.4), t: 0 });
  }
}
// ══ 벌목 — 실제 게임 modules/axetree.js 이식. 원본은 three-pinata로 밑동을 잘라 위/아래를 분리하지만,
//   여기서는 절단 없이 **쓰러짐 물리만** 같은 공식으로 재현한다(MAX_CHOPS 5회, 축=up×fallDir,
//   2.1초에 걸쳐 Math.PI*0.55까지 기울어짐 — 원본 animFall 그대로). 쓰러진 뒤 페이드아웃.
const MAX_CHOPS = 5;
const fallingTrees = [];
function chopNode(node, hitPoint, fromPos){
  if (node.broken) return;
  node.chops = (node.chops || 0) + 1;
  spawnChips(hitPoint, 5, new THREE.Color(0x8a5a32)); // 나뭇조각
  if (node.chops >= MAX_CHOPS) fellTree(node, fromPos);
}
// ★사령관 지시 "밑둥 남겨": 원본 axetree.js는 three-pinata `sliceWorld`로 찍은 높이에서 나무를 잘라
//   위(쓰러짐)/아래(그루터기)로 나눈다. 여기서는 이미 들어가 있는 CSG로 같은 절단을 한다 —
//   큰 상자를 절단면 위/아래에 각각 빼서 두 조각을 만든다(결과는 동일하고 의존성 추가가 없다).
// ★사령관 지적 "잘린 단면이 흰 원반으로 보인다": 원본 axetree.js는 겉(텍스처)과 **단면(목재색 capMat)** 을
//   분리해 단면에 나무 속살색을 쓴다(`capMat = color 0xcea463, roughness 0.85, DoubleSide`). 그 값 그대로 쓰고,
//   CSG는 `useGroups=true`로 두면 잘라낸 면에 두 번째 머티리얼이 자동 배정된다.
const CAP_MAT = new THREE.MeshStandardMaterial({ color: 0xcea463, roughness: 0.85, side: THREE.DoubleSide });
const _sliceEval = new Evaluator(); _sliceEval.useGroups = true;
function sliceTreeAt(mesh, cutWorldY){
  const geo = normalizeGeoForCSG(mesh.geometry);
  const base = new Brush(geo, mesh.material);
  base.position.copy(mesh.position); base.rotation.copy(mesh.rotation); base.scale.copy(mesh.scale);
  base.updateMatrixWorld(true);
  const BIG = 400;
  const mk = (centerY) => {
    const b = new Brush(normalizeGeoForCSG(new THREE.BoxGeometry(BIG, BIG, BIG)), CAP_MAT);
    b.position.set(mesh.position.x, centerY, mesh.position.z); b.updateMatrixWorld(true);
    return b;
  };
  let top = null, stump = null;
  try {
    top   = _sliceEval.evaluate(base, mk(cutWorldY - BIG/2), SUBTRACTION); // 절단면 아래를 빼면 윗동
    base.updateMatrixWorld(true);
    stump = _sliceEval.evaluate(base, mk(cutWorldY + BIG/2), SUBTRACTION); // 절단면 위를 빼면 밑동
  } catch (e) { console.warn('[hearthling] 나무 절단 실패', e && e.message); return null; }
  // useGroups 결과는 [겉 재질, 단면 재질] 2머티리얼 — 겉은 원본 나무 텍스처, 단면은 목재색
  const mats = [Array.isArray(mesh.material) ? mesh.material[0] : mesh.material, CAP_MAT];
  for (const o of [top, stump]) if (o){ o.material = mats; o.castShadow = o.receiveShadow = true; }
  return { top, stump };
}
// 원본 axetree.js `cutTree` 구조 그대로:
//   ① 절단면(cutY)에서 자른다 → 아래=그루터기(그 자리에 고정) / 위=쓰러짐
//   ② 쓰러지는 쪽은 **절단면을 경첩(pivot)** 으로 회전한다(지면이 아니라 잘린 자리에서 넘어간다)
//   ③ 절단 실패 시 통째로 경첩 회전(원본도 같은 폴백을 둔다 — 절단은 못해도 쓰러짐은 보장)
function fellTree(node, fromPos){
  if (node.broken || !node.mesh) return;
  node.broken = true; node.brokenAt = performance.now(); // 리스폰 타이머 시작
  const src = node.mesh;
  const gy = groundAt(node.x, node.z) ?? src.position.y;
  // 원본: cutY = max(gy+0.5, hitY) — 찍은 높이에서 자른다
  const cutY = Math.max(gy + 0.5, gy + Math.max(0.7, (node.r || 1) * 1.1));
  // 쓰러짐 방향 = 베는 사람 → 나무(실제 벌목처럼 베는 반대편으로 넘어간다)
  const dx = node.x - (fromPos ? fromPos.x : node.x - 1);
  const dz = node.z - (fromPos ? fromPos.z : node.z);
  const L = Math.hypot(dx, dz) || 1;
  const dir = { x: dx/L, z: dz/L };
  const pivot = new THREE.Vector3(node.x, cutY, node.z); // ★경첩은 절단면(지면 아님)

  const cut = sliceTreeAt(src, cutY);
  scene.remove(src);
  // ★버그(사령관 "나무 쓰러지는데 그대로 나무가 있고"): 절단해놓고 정작 **원본**을 쓰러뜨리고
  //   잘린 윗동은 제자리에 세워뒀었다. 쓰러뜨릴 대상은 반드시 절단된 윗동이어야 한다.
  let fallSrc = src, stump = null;
  if (cut && cut.top && cut.stump){ fallSrc = cut.top; stump = cut.stump; }
  if (stump){ scene.add(stump); node.stump = stump; }

  // 원본 animFall과 동일 — 지오메트리를 월드로 편 뒤 경첩 기준으로 옮겨 그룹에 담는다.
  fallSrc.updateMatrixWorld(true);
  const wg = fallSrc.geometry.clone();
  wg.applyMatrix4(fallSrc.matrixWorld);
  wg.translate(-pivot.x, -pivot.y, -pivot.z);
  const mats = Array.isArray(fallSrc.material) ? fallSrc.material.map(mm => mm.clone()) : fallSrc.material.clone();
  const grp = new THREE.Group();
  grp.position.copy(pivot);
  const fm = new THREE.Mesh(wg, mats);
  fm.castShadow = fm.receiveShadow = true;
  grp.add(fm);
  scene.add(grp);

  fallingTrees.push({ grp, axis: new THREE.Vector3(dir.z, 0, -dir.x).normalize(),
    t: 0, dur: 2.1, max: Math.PI*0.55, bornAt: performance.now(), impacted: false });
  node.fallen = grp;
}
function tickFalling(dt){
  const now = performance.now();
  for (let i = fallingTrees.length-1; i >= 0; i--){
    const f = fallingTrees[i];
    if (f.t < f.dur){
      f.t += dt;
      const k = Math.min(1, f.t/f.dur);
      const e = k*k*(3-2*k); // ease — 처음엔 천천히 기울다 끝에 쿵
      f.grp.quaternion.setFromAxisAngle(f.axis, f.max * e);
      if (!f.impacted && k >= 1){
        f.impacted = true;
        // 착지 임팩트 — 원본은 쿵 소리+먼지. 여기선 먼지(칩)만.
        const p = f.grp.position.clone(); p.y += 0.4;
        spawnChips(p, 10, new THREE.Color(0x9c8f74));
      }
    }
    const age = (now - f.bornAt)/1000;
    if (age > 9){
      f.grp.traverse(o => { if (o.isMesh && o.material){ o.material.transparent = true; o.material.opacity = Math.max(0, 1-(age-9)*0.6); o.material.depthWrite = false; } });
      if (age > 11){ scene.remove(f.grp); fallingTrees.splice(i,1); }
    }
  }
}
function tickMining(dt){
  tickFalling(dt);
  respawnSites(performance.now()); // 다 캔 자원은 같은 자리에 다시 자란다(설계 §2)
  // 칩: 중력 포물선 → 0.9초 뒤 소멸
  for (let i = chips.length-1; i >= 0; i--){
    const c = chips[i];
    c.t += dt; c.v.y -= 20*dt;
    c.m.position.addScaledVector(c.v, dt);
    if (c.t > 0.9){ scene.remove(c.m); c.m.material.dispose(); chips.splice(i,1); }
  }
  if (physicsWorld) physicsWorld.step();
  // 파편: 물리 위치 동기 + 7초 뒤 페이드, 8.5초에 제거(원본과 동일한 수명)
  const now = performance.now();
  for (let i = debrisList.length-1; i >= 0; i--){
    const d = debrisList[i];
    if (d.body){ const t = d.body.translation(), q = d.body.rotation();
      d.mesh.position.set(t.x, t.y, t.z); d.mesh.quaternion.set(q.x, q.y, q.z, q.w); }
    const age = (now - d.bornAt)/1000;
    if (age > 7){
      const o = Math.max(0, 1-(age-7)*0.7);
      d.mesh.material.transparent = true; d.mesh.material.opacity = o; d.mesh.material.depthWrite = false;
      if (age > 8.5){
        scene.remove(d.mesh); d.mesh.material.dispose();
        if (d.body && physicsWorld){ try { physicsWorld.removeRigidBody(d.body); } catch(e){} }
        debrisList.splice(i,1);
      }
    }
  }
}
window.__carveNode = carveNode; // 디버그 훅
window.__chopNode = (n,p,f) => chopNode(n,p,f); // 디버그 훅(벌목)
window.__nodes = () => NODES;   // 디버그 훅(광물/나무 노드 목록)

// ══════════════ 작업장 (설계안 §2) ══════════════
// 지금까지는 섬 전역에 흩어진 자원 중 가까운 것을 그때그때 고르고, 안 맞으면 거리·가시성 필터를 덧붙이는
// 식이었다. 그래서 "화면 밖에서 일한다 / 벌목을 안 한다 / 고갈된다"가 반복됐다.
// 광산·숲을 **활동권 안 고정 구역**으로 정의하고, 그 구역 안에만 자원을 모아둔다. 다 캐면 같은 자리에
// 다시 자라난다(리스폰) — 에이전트가 응답할 때까지 계속 일할 수 있어야 하므로 고갈되면 안 된다.
const RESPAWN_MS = 12000;
const WORK_SITES = {
  // ★사령관 "벌목이랑 광물 캐는 건 어디 감?"(2026-08-11) — 퍼뜨리다가 1.30/1.55까지 밀어 자원이
  //   화면 가장자리로 나가버렸다. 대장간·시장보다 살짝 뒤(안쪽)에 두어 둘 다 보이게 한다.
  ore:    { angle: Math.PI*0.74, spread: 1.06, radius: 7.5, want: 9, members: [] }, // 화면 좌 = 광산
  forage: { angle: Math.PI*0.26, spread: 1.30, radius: 9.0, want: 9, members: [] }, // 화면 우 = 숲
};
function layoutWorkSites(oreList, treeList){
  for (const key of ['ore','forage']){
    const s = WORK_SITES[key];
    const c = frameEllipse(s.angle, FRAME_R * s.spread);
    const land = landInFrame(c.x, c.z);
    s.cx = land.x; s.cz = land.z;
  }
  gatherIntoSite(oreList, WORK_SITES.ore, true);
  gatherIntoSite(treeList, WORK_SITES.forage, false);
  console.log('[hearthling] 작업장 — 광산('+WORK_SITES.ore.members.length+') 숲('+WORK_SITES.forage.members.length+')');
  window.__sites = WORK_SITES; // 디버그 훅
}
// 구역에서 가까운 것들을 골라 **구역 안에 고르게** 재배치한다(원본 배치 개수는 유지, 위치만 모은다).
function gatherIntoSite(list, site, isOre){
  const d2 = n => Math.hypot(n.x - site.cx, n.z - site.cz);
  const chosen = list.filter(n => !n.broken).sort((a,b) => d2(a) - d2(b)).slice(0, site.want);
  chosen.forEach((n, i) => {
    const ang = (i / chosen.length) * Math.PI*2 + (isOre ? 0.4 : 1.1);
    const rad = site.radius * (0.30 + 0.70 * (((i*5) % chosen.length) / chosen.length));
    const land = findLandNear(site.cx + Math.cos(ang)*rad, site.cz + Math.sin(ang)*rad);
    const gy = groundAt(land.x, land.z);
    n.x = land.x; n.z = land.z; n.y = gy ?? n.y;
    n.site = site;
    if (n.mesh){
      n.mesh.position.set(land.x, (gy ?? 0) + (isOre ? -0.1 : 0), land.z);
      // 작업장은 카메라 코앞이라 원본 높이(15~30)면 화면 위를 통째로 덮는다 — 이 구역 나무만 낮춘다
      // (배경의 숲은 원본 크기 그대로 유지해서 원경 실루엣은 안 바뀐다).
      if (!isOre){
        const bb = new THREE.Box3().setFromObject(n.mesh);
        const h = bb.max.y - bb.min.y;
        if (h > 13) n.mesh.scale.multiplyScalar(13 / h);
        n.r = Math.max(0.8, n.r * Math.min(1, 13 / Math.max(h, 0.001)));
      }
      n.origMesh = n.mesh; // 리스폰 때 되살릴 원본
    }
  });
  site.members = chosen;
}
// 다 캔 자원은 잠시 뒤 같은 자리에 다시 자란다 — 그루터기는 치우고 원본 메시를 되돌린다.
function respawnSites(now){
  for (const key of ['ore','forage']){
    for (const n of WORK_SITES[key].members){
      if (!n.broken || !n.brokenAt || now - n.brokenAt < RESPAWN_MS) continue;
      if (n.stump){ scene.remove(n.stump); n.stump = null; }
      if (n.fallen){ scene.remove(n.fallen); n.fallen = null; }
      if (n.brush){ scene.remove(n.brush); n.brush = null; }
      if (n.origMesh){
        n.origMesh.position.set(n.x, (groundAt(n.x, n.z) ?? 0) + (key === 'ore' ? -0.1 : 0), n.z);
        scene.add(n.origMesh);
        n.mesh = n.origMesh;
      }
      n.broken = false; n.brokenAt = 0; n.carves = 0; n.chops = 0;
    }
  }
}
function pickNode(category){
  if (category === 'ore' || category === 'forage'){
    const alive = WORK_SITES[category].members.filter(n => !n.broken);
    if (alive.length) return alive[Math.floor(Math.random()*alive.length)];
    // 전부 캐낸 순간 — 리스폰 전이면 본부로 보내 놀지 않게 한다
    return NODES.base[Math.floor(Math.random()*NODES.base.length)];
  }
  // 제작(build) 목적지는 건물이다. 중심을 목표로 주면 **이미 건물 앞에 서 있는 워커는 출발하자마자 도착**해
  // TRAVEL>IDLE만 반복하며 벽에 붙어 제자리걸음을 한다(사령관 "벽에 아직도 박고 있는 애가 있음").
  // 매번 건물 둘레의 다른 자리를 잡아 그쪽으로 걸어가 망치질하게 한다 — 목수가 집을 돌며 짓는 그림이 된다.
  // 건물 작업장(대장간·제재소·시장) — 건물 앞 고정 작업 지점으로 보낸다. 대장간은 모루 앞.
  if (WORK_SPOT[category]){
    const s = WORK_SPOT[category];
    return { x: s.x, z: s.z, r: 0, face: s.anvil || { x: s.buildingX, z: s.buildingZ } };
  }
  if (category === 'build' && buildSiteRadius > 0 && buildSitePos){
    const ang = Math.random() * Math.PI * 2;
    const rr = buildSiteRadius + 1.6;
    return { x: buildSitePos.x + Math.cos(ang)*rr, z: buildSitePos.z + Math.sin(ang)*rr, r: 0 };
  }
  const list = NODES[category] || NODES.base;
  return list[Math.floor(Math.random()*list.length)];
}

// ══ 건설 현장 — 사령관 지시(2026-08-08): "가운데 건물이 고스트 상태에서 점점 채워지며 완성, 완성되면
//   토큰 얼마나 썼는지 보이면 됨" — NODES.build[0](제작 워커가 실제로 가는 그 자리)에 항상 떠 있는 반투명
//   청사진 위에, 가장 토큰을 많이 쓴 진행중 job의 진행률만큼 실물이 아래에서부터 차오른다.
const ENV_BASE = './assets/env/';
let buildSiteSolid = null, buildSiteHeight = 13, buildSitePos = null; // ★사령관 "건물이 너무작음"(2026-08-08) — 캐릭터 기준(1.5) 4배(6)→7배(11). 2026-08-13 대기항목("건설현장 집이 주변 건물보다 작아 보인다") 실측 19%→13으로 22.5%, 화면에서 가장 큰 덩어리가 되게
let buildSiteClip = null, buildSiteGhost = null, buildSiteGroundY = 0, buildFillShown = 0; // 게이지 절단면·고스트·표시중 진행률(부드럽게 따라감)
let buildSiteRadius = 0; // 건물 발자국 반경 — 워커가 통과하지 못하게 막는 경계
const buildCompletedJobs = new Set();
// 건물 한 채에 필요한 납품 횟수 — 워커가 실제로 캐 와서 내려놓은 만큼만 게이지가 오른다.
const DELIVERIES_PER_BUILDING = 16;
let deliveredCount = 0;

// ══════ 마을 작업장 — ★사령관 지시(2026-08-11) ══════
// "집만 짓는 게 아니라 대장간 건물 앞에서 모루에서 작업하는 애도 있어야 할 것 같고 그런 느낌"
// 실제 게임 settlement.js가 쓰는 KayKit Hexagon 건물(대장간·제재소·시장)을 활동권 안에 세우고,
// 각 건물 앞에 워커가 서는 작업 지점을 만든다. 대장간 앞에는 모루(kenney workbench-anvil)를 놓는다.
const WORK_BUILDINGS = {
  // 각도는 frameEllipse 기준: 0.20π=화면 우, 0.50π=중앙 위, 0.80π=화면 좌. π~2π는 카메라 앞쪽이라
  // 화면 아래로 잘린다(첫 시도에서 smith y=-0.85, trade y=-0.98로 밀려 실측 후 0~π 구간으로 옮김).
  // ★사령관 지적(2026-08-11) "건물들이 사람에 비해서 너무 작음" — 캐릭터 1.5m 기준 7~8m는 2층집도 안 됐다.
  //   실제 마을 스케일로 키운다(건설현장 집 11m와 어울리는 13~15m).
  // ★사령관 지적(2026-08-11) "조금 멀리 퍼지게 해야 하지 않나, 전체적으로 퍼지게 배치" —
  //   건물이 중앙(건설현장)에 몰려 답답했다. spread를 키워 활동권 가장자리로 밀고 각도도 벌린다.
  //   단 너무 벌리면 양끝이 잘린다(spread 1.05에서 대장간·시장이 화면 밖으로 반쯤 나감) — 0.86으로 되돌림.
  // ★대기항목(2026-08-12) "시장이 화면 우측을 크게 차지한다 · 건설현장 집이 주변 건물보다 작아 보인다" —
  //   실측(2026-08-13, 2560×1215)에서 원인은 배치가 아니라 **크기를 맞춘 축**이었다. 높이(Y)로만 정규화하면
  //   좌판·울타리·마당이 딸린 모델일수록 가로로 부푼다. 같은 13m인데 시장은 가로 27.9m(화면 44.8%),
  //   대장간은 21.7m(44.5%)여서 둘이 화면 폭 89%를 먹었고 대장간은 왼쪽 끝이 잘렸다.
  //   → 가로 발자국(footprint)을 기준으로 맞추고 높이는 결과값으로 둔다. height는 이제 참고 표기다.
  //   목표: 좌우 건물 각 32%, 가운데 건설현장이 가장 큰 덩어리가 되게.
  //   ※ footprint는 회전 전 기준이다. 건물은 카메라를 향해 약 45° 돌아가므로 화면 폭은 여기서 1.2~1.3배 커진다.
  //   ※ 건설현장을 키우면 카메라 반경(FRAME_R)이 함께 커져 좌우 건물이 밖으로 밀린다 — spread를 같이 줄인다.
  smith: { file:'building_blacksmith_blue.gltf', name:'대장간', angle: Math.PI*0.94, spread: 0.86, footprint: 12.2, anvil: true },
  saw:   { file:'building_lumbermill_blue.gltf', name:'제재소', angle: Math.PI*0.50, spread: 1.55, footprint: 12.5 },
  trade: { file:'building_market_blue.gltf',     name:'시장',   angle: Math.PI*0.06, spread: 0.80, footprint: 13.8 },
};
// 각 작업장의 워커 작업 지점(건물 앞) — pickNode가 목적지로 쓴다.
const WORK_SPOT = {};
async function loadWorkBuildings(){
  const gl = new GLTFLoader();
  for (const key in WORK_BUILDINGS){
    const b = WORK_BUILDINGS[key];
    const c = frameEllipse(b.angle, FRAME_R * b.spread);
    const land = landInFrame(c.x, c.z);
    const gy = groundAt(land.x, land.z) ?? 0;
    let root;
    try { root = await new Promise((res, rej) => gl.load(REAL + 'buildings/' + b.file, g => res(g.scene), undefined, rej)); }
    catch (e){ console.warn('[hearthling] 작업장 건물 로드 실패', b.file, e); continue; }
    root.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; if (o.material && o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace; } });
    const bb0 = new THREE.Box3().setFromObject(root);
    const sz = new THREE.Vector3(); bb0.getSize(sz);
    // 가로 발자국 기준 정규화(위 주석 참고). footprint가 없으면 예전처럼 높이 기준.
    const spanXZ = Math.max(sz.x, sz.z) || 1;
    root.scale.setScalar(b.footprint ? b.footprint / spanXZ : b.height / (sz.y || 1));
    const bb = new THREE.Box3().setFromObject(root);
    const ctr = bb.getCenter(new THREE.Vector3());
    root.position.x -= ctr.x; root.position.z -= ctr.z; root.position.y -= bb.min.y;
    const grp = new THREE.Group(); grp.add(root); grp.position.set(land.x, gy, land.z);
    // 건물이 카메라를 향하도록 — 정면(문·좌판)이 보여야 앞에서 일하는 그림이 산다
    grp.rotation.y = Math.atan2(camera.position.x - land.x, camera.position.z - land.z);
    scene.add(grp);

    const fs = new THREE.Vector3(); new THREE.Box3().setFromObject(grp).getSize(fs);
    const foot = Math.max(fs.x, fs.z) * 0.5;
    // 작업 지점 = 건물 정면(카메라 쪽)으로 발자국 반경만큼 나온 자리
    const dx = camera.position.x - land.x, dz = camera.position.z - land.z;
    const L = Math.hypot(dx, dz) || 1;
    const sx = land.x + (dx/L) * (foot + 1.8), sz2 = land.z + (dz/L) * (foot + 1.8);
    const spot = findLandNear(sx, sz2);
    WORK_SPOT[key] = { x: spot.x, z: spot.z, r: 0, buildingX: land.x, buildingZ: land.z, foot };
    addObstacle(land.x, land.z, foot * 0.72); // 워커가 통과 못 하게 — 실측 발자국은 지붕 처마까지라 몸통 기준으로 줄인다

    if (b.anvil){
      try {
        const ag = await new Promise((res, rej) => gl.load(REAL + 'buildings/workbench-anvil.glb', g => res(g.scene), undefined, rej));
        // ★사령관 지적(2026-08-11) "모루 조금 더 키우는데 지금 흰색으로 되어 있음" — kenney 모델은 GLB에
        //   텍스처가 없어 공유 colormap을 직접 물려야 한다(도구 장착 때와 같은 처리). 안 물리면 흰 덩어리.
        const cmap = toolColormap();
        ag.traverse(o => {
          if (!o.isMesh) return;
          o.castShadow = true; o.receiveShadow = true;
          o.material = o.material.clone();
          o.material.map = cmap; o.material.color.setHex(0xffffff);
          o.material.metalness = 0.25; o.material.roughness = 0.65;
          o.material.needsUpdate = true;
        });
        const ab = new THREE.Box3().setFromObject(ag); const asz = new THREE.Vector3(); ab.getSize(asz);
        ag.scale.setScalar(1.9 / (asz.y || 1));   // 캐릭터 1.5m 기준 가슴 높이 — 먼 쿼터뷰에서 읽히도록 키움
        const ab2 = new THREE.Box3().setFromObject(ag); ag.position.y -= ab2.min.y;
        // 워커와 건물 사이, 살짝 옆으로 — 워커가 모루를 마주보고 두드리는 배치
        const px = spot.x + (dx/L) * 0.9, pz = spot.z + (dz/L) * 0.9;
        const anvilPos = findLandNear(px, pz);
        ag.position.x += anvilPos.x; ag.position.z += anvilPos.z;
        ag.position.y += groundAt(anvilPos.x, anvilPos.z) ?? gy;
        ag.rotation.y = grp.rotation.y;
        scene.add(ag);
        WORK_SPOT[key].anvil = { x: anvilPos.x, z: anvilPos.z };
      } catch (e){ console.warn('[hearthling] 모루 로드 실패', e); }
    }
    console.log('[hearthling] 작업장 건물 —', b.name, '발자국', foot.toFixed(1), '작업지점', spot.x.toFixed(1), spot.z.toFixed(1));
  }
  window.__workSpots = WORK_SPOT; // 디버그 훅
}

async function loadBuildSite(){
  const pos = NODES.build[0];
  buildSitePos = pos;
  const gy = groundAt(pos.x, pos.z) ?? 0;
  const gl = new GLTFLoader();
  // 내섬관리 실제 건물 에셋(KayKit Hexagon, settlement.js가 쓰는 것과 동일 파일군) — Kenney 플레이스홀더 대체.
  // ★사령관 지적(2026-08-08 "장식 아직도 보이는데 고스트가아니라?"): market은 좌판·천막·자루더미처럼 얇고
  //   겹치는 장식 메시가 많아, opacity=0.5 반투명 고스트로 렌더하면 겹친 레이어마다 불투명도가 누적되어
  //   특정 부위만 유독 진하게(거의 불투명하게) 보이는 렌더링 아티팩트가 생겼다. 장식이 거의 없는 단순한
  //   단일 볼륨 건물(home_A)로 교체 — 같은 반투명 고스트 기법이라도 겹치는 면이 적어야 깨끗하게 읽힌다.
  const base = await new Promise((res, rej) => gl.load(REAL + 'buildings/building_home_A_blue.gltf', g => res(g.scene), undefined, rej));
  base.traverse(o => { if (o.isMesh && o.material && o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace; });

  const measure = new THREE.Box3().setFromObject(base);
  const sz = new THREE.Vector3(); measure.getSize(sz);
  const scale = buildSiteHeight / (sz.y || 1);

  // 고스트(청사진) — settlement.js ghostShow()와 동일 기법: 와이어프레임이 아니라 원본 메시를 그대로
  // 반투명 복제(opacity 0.5, depthWrite off) + emissive 틴트. 실제 게임 고스트가 이 방식이다.
  const ghost = base.clone(true);
  ghost.traverse(o => {
    if (!o.isMesh) return;
    o.material = o.material.clone();
    o.material.transparent = true; o.material.opacity = 0.5; o.material.depthWrite = false;
    if (o.material.emissive) o.material.emissive.setHex(0xffcf6b);
    if ('emissiveIntensity' in o.material) o.material.emissiveIntensity = 0.5;
  });
  ghost.scale.setScalar(scale);
  // ★사령관 "집이 가운데 구도로 와야하고"(2026-08-08) — home_A 모델 원점이 발자국 중심이 아니라 한쪽으로
  // 치우쳐 있어, Y만 바닥에 맞추면 X/Z가 카메라 타겟(=화면 중앙)에서 옆으로 밀려 보였다. XZ도 바운딩박스
  // 중심으로 맞춘다.
  const gb = new THREE.Box3().setFromObject(ghost);
  const gc = gb.getCenter(new THREE.Vector3());
  ghost.position.x -= gc.x; ghost.position.z -= gc.z; ghost.position.y -= gb.min.y;
  const ghostGroup = new THREE.Group(); ghostGroup.add(ghost); ghostGroup.position.set(pos.x, gy, pos.z);
  scene.add(ghostGroup);

  // 실물 — ★사령관 지적(2026-08-10): "건물이 저렇게 세워지는 게 아님. 밑에서 고스트 게이지가 차서 마지막에
  //   완성되는 형태". 기존 Y스케일 성장은 집 전체가 눌린 채 늘어나서(지붕이 납작하게 깔린 채 자람) 완전히
  //   다른 그림이었다. 형태는 처음부터 온전히 두고 **아래에서 위로 차오르는 수평 절단면**으로 바꾼다 —
  //   three의 로컬 클리핑 평면으로 "이 높이 아래만 렌더"하면 물이 차오르듯 채워진다.
  const solid = base.clone(true);
  const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), gy); // 평면 아래쪽(y ≤ constant)만 보인다
  solid.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    o.material = o.material.clone();
    o.material.clippingPlanes = [clipPlane];
    o.material.clipShadows = true;
    o.material.side = THREE.DoubleSide; // 절단면 너머 안쪽 벽이 뚫려 보이지 않게
  });
  solid.scale.setScalar(scale);
  const sb = new THREE.Box3().setFromObject(solid);
  const sc = sb.getCenter(new THREE.Vector3());
  solid.position.x -= sc.x; solid.position.z -= sc.z; solid.position.y -= sb.min.y;
  const solidGroup = new THREE.Group(); solidGroup.add(solid); solidGroup.position.set(pos.x, gy, pos.z);
  solidGroup.visible = false; // 첫 poll 전까지 아무것도 안 보이게(고스트만 뜬 상태로 시작)
  scene.add(solidGroup);

  // ★사령관 지적(2026-08-10) "투명으로 집을 뚫고 들어가면 안 되지 않나" — 워커 이동이 직선 보간이라
  //   건설 현장 한가운데를 그대로 통과했다(고스트든 실물이든 뚫고 지나가면 안 된다). 실측 발자국 반경을
  //   저장해 두고, 이동할 때 그 원 밖으로 밀어낸다.
  const fb = new THREE.Box3().setFromObject(solidGroup);
  const fsz = new THREE.Vector3(); fb.getSize(fsz);
  buildSiteRadius = Math.max(fsz.x, fsz.z) * 0.5 + 0.6;
  addObstacle(pos.x, pos.z, buildSiteRadius); // 장애물 목록에 등록(작업장 건물과 같은 규칙으로 처리)
  window.__buildR = buildSiteRadius; // 디버그 훅

  buildSiteSolid = solidGroup;
  buildSiteClip = clipPlane;
  buildSiteGhost = ghostGroup;
  buildSiteGroundY = gy;
  window.__buildSiteSolid = solidGroup; // 디버그 훅
}

// ★사령관 지시(2026-08-11) "에이전트 돌리잖아 그러면 그 돌리는 양만큼 워커들이 일해,
//   그러면 에이전트 작업 종료하면 그거에 맞춰서 건물 올라가야 함" —
//   건물은 **한 에이전트(세션)의 일**이다. 그 에이전트가 도는 동안 워커들이 자재를 나르며 게이지가 오르고,
//   그 에이전트가 실제로 끝나는 순간(done/completed) 건물이 완성된다.
//   그래서 납품 게이지에는 상한을 둔다 — 아무리 많이 날라도 에이전트가 안 끝났으면 완성되지 않는다.
const BUILD_FILL_CAP = 0.92;
const JOB_DONE_STATES = new Set(['done', 'completed']);
const JOB_DEAD_STATES = new Set(['failed', 'error', 'killed']);
let buildOwnerId = null, buildOwnerName = '';
function updateBuildSite(jobs){
  if (!buildSiteSolid) return;
  if (buildDoneAt) return; // 완성 연출 중에는 손대지 않는다
  // ★사령관 "고스트 아래 머가 보인다" — 진행률 0일 때도 scale.y를 0.001로만 낮췄지 완전히 안 없앴다.
  //   0.001이라도 스케일>0이면 납작하게 눌린 실물 바닥면이 고스트 밑에서 계속 비쳐 보인다. visible 자체를
  //   꺼서 진행 중인 job이 없으면 아예 렌더 안 되게 한다(고스트 반투명 청사진만 남음).
  // ★사령관 지적(2026-08-10) "아직 완성이 안 됐는데 고스트가 끝남" — 진행률이 `job.tokens/50000`이라
  //   세션 토큰이 수십만이면 **시작하자마자 100%** 였다. 화면의 노동과 건물이 아무 관계가 없었던 것.
  //   설계안 §5대로 **워커가 실제로 납품한 횟수**로 바꾼다 — 캐 와서 내려놔야만 게이지가 오른다.
  const byId = new Map(jobs.map(j => [j.jobId, j]));
  let owner = buildOwnerId ? byId.get(buildOwnerId) : null;

  if (owner && JOB_DONE_STATES.has(owner.state)){
    // ★그 에이전트가 작업을 끝냈다 = 건물 완성. 남은 게이지는 한 번에 차오른다.
    buildDoneAt = performance.now();
    buildDoneTokens = owner.tokens || 0;
    buildDoneName = buildOwnerName;
    buildTargetFill = 1;
    buildOwnerId = null;
    return;
  }
  // 주인이 없거나(첫 실행) 죽었으면(failed) 새로 뽑는다 — 지금 실제로 돌고 있는 job 중 토큰 최다
  if (!owner || JOB_DEAD_STATES.has(owner.state)){
    if (owner) { deliveredCount = 0; buildTargetFill = 0; buildFillShown = 0; } // 실패한 일감은 처음부터
    const cand = jobs.filter(j => j.state === 'active').sort((a,b) => (b.tokens||0)-(a.tokens||0))[0]
              || jobs.filter(j => !JOB_DONE_STATES.has(j.state) && !JOB_DEAD_STATES.has(j.state))[0];
    buildOwnerId = cand ? cand.jobId : null;
    buildOwnerName = cand ? String(cand.name || cand.jobId) : '';
  }
  // 게이지 = 워커가 실제로 나른 양(=에이전트가 도는 양). 단 상한까지만 — 완성은 에이전트가 끝내야 한다.
  buildTargetFill = Math.min(BUILD_FILL_CAP, deliveredCount / DELIVERIES_PER_BUILDING);
}

// 게이지는 매 프레임 목표치를 부드럽게 따라간다(폴링 간격 1초마다 뚝뚝 끊기지 않게).
let buildTargetFill = 0, buildDoneAt = 0, buildDoneTokens = 0, buildDoneName = '';
function tickBuildSite(dt){
  if (!buildSiteSolid || !buildSiteClip) return;
  buildFillShown += (buildTargetFill - buildFillShown) * Math.min(1, dt * 2.2);
  const filled = buildFillShown > 0.004;
  buildSiteSolid.visible = filled;
  // 절단면 높이 = 바닥 + 건물높이×진행률. 이 높이 아래만 렌더되므로 물이 차오르듯 채워진다.
  buildSiteClip.constant = buildSiteGroundY + buildSiteHeight * buildFillShown;
  // 완성되면 고스트(청사진)를 걷어내고 실물만 남긴다 — "마지막에 완성되는 형태".
  if (buildDoneAt) {
    const since = (performance.now() - buildDoneAt) / 1000;
    if (buildGhostFade < 1) {
      buildGhostFade = Math.min(1, buildGhostFade + dt * 0.9);
      if (buildSiteGhost) buildSiteGhost.traverse(o => {
        if (o.isMesh && o.material) o.material.opacity = 0.5 * (1 - buildGhostFade);
      });
    }
    if (since > 0.4 && !buildDonePopped) {
      buildDonePopped = true;
      spawnYieldPopup(buildSitePos.x, buildSiteGroundY + buildSiteHeight + 3, buildSitePos.z,
        (KO ? '완성' : 'Complete') + ' · ' + (buildDoneName || disp('에이전트')) + ' · ' + fmtTok(buildDoneTokens), '#ffe27a');
    }
    // 다음 건물을 위해 리셋 — 고스트가 다시 떠오르고 게이지는 0부터
    if (since > 6) {
      buildDoneAt = 0; buildDonePopped = false; buildGhostFade = 0;
      buildFillShown = 0; buildTargetFill = 0;
      deliveredCount = 0; // 다음 건물은 다시 0채부터 — 납품이 쌓여야 올라간다
      if (buildSiteGhost) buildSiteGhost.traverse(o => { if (o.isMesh && o.material) o.material.opacity = 0.5; });
    }
  }
}
let buildGhostFade = 0, buildDonePopped = false;

function makeLabelSprite(w, hpx){
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = hpx || 64;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest:false, transparent:true });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(w||6, (hpx||64)/(256/(w||6)), 1);
  return { spr, cv, ctx, tex };
}

function drawText(label, text, color, size){
  const { ctx, cv, tex } = label;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = 'rgba(10,14,8,0.72)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(2,2,cv.width-4,cv.height-4,10); else ctx.rect(2,2,cv.width-4,cv.height-4);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.font = `${size}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cv.width/2, cv.height/2);
  tex.needsUpdate = true;
}

// 세션 제목처럼 길이가 제각각인 문자열용 — 캔버스(256px) 안에 들어가도록 글자 크기를 줄여가며 맞춘다.
function drawTextFit(label, text, color, maxSize){
  const { ctx } = label;
  let size = maxSize || 20;
  ctx.font = `${size}px system-ui, sans-serif`;
  while (size > 10 && ctx.measureText(text).width > 240){
    size -= 1;
    ctx.font = `${size}px system-ui, sans-serif`;
  }
  drawText(label, text, color, size);
}

function drawBar(label, ratio, color){
  const { ctx, cv, tex } = label;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = 'rgba(10,14,8,0.55)';
  ctx.fillRect(0, cv.height*0.35, cv.width, cv.height*0.3);
  ctx.fillStyle = color;
  ctx.fillRect(0, cv.height*0.35, cv.width*Math.max(0,Math.min(1,ratio)), cv.height*0.3);
  tex.needsUpdate = true;
}

const workers = new Map(); // jobId -> worker
window.__workers = workers; window.__sendToWork = sendToWork; window.__spawnYieldPopup = spawnYieldPopup; // 디버그 훅
const mixers = [];

// 이미 서 있는 워커와 너무 가까운 자리인지 — 활성 세션까지 워커로 잡으면서 인원이 늘어 겹침이 잦아졌다.
function tooCloseToWorkers(x, z, r){
  for (const v of workers.values()) {
    const dx = v.group.position.x - x, dz = v.group.position.z - z;
    if (dx*dx + dz*dz < r*r) return true;
  }
  return false;
}
function baseWorker(jobId, isTransient){
  const group = new THREE.Group();
  let p = hashPos(jobId);
  // 해시 자리가 이미 찬 경우 접미사를 바꿔 다른 자리를 찾는다(결정적이라 새로고침해도 같은 결과).
  for (let k = 0; k < 10 && !isTransient && tooCloseToWorkers(p.x, p.z, 6.5); k++) p = hashPos(jobId + '~' + k);
  const jp = isTransient ? findLandNear(p.x + (Math.random()*4-2), p.z + (Math.random()*4-2)) : p;
  const jy = (jp.y != null ? jp.y : groundAt(jp.x, jp.z)) ?? 0.3;
  group.position.set(jp.x, jy + 0.02, jp.z);
  scene.add(group);

  // 로드 전까지 보여줄 임시 캡슐(로드 실패해도 최소한 상태색은 보이도록 유지)
  const placeholder = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.6, 1.2, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.6 })
  );
  placeholder.position.y = 1.2;
  group.add(placeholder);

  // 클릭 판정용 보이지 않는 히트박스 — 캐릭터는 SkinnedMesh라 레이캐스트가 **바인드 포즈** 기준으로
  // 계산돼 애니메이션 중인 실제 위치와 어긋난다(실측: 클릭이 한 번도 안 잡혔다). 단순 실린더로 받는다.
  const hitbox = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 0.85, 2.4, 10),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitbox.position.y = 1.2;
  group.add(hitbox);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 1.15, 24),
    new THREE.MeshBasicMaterial({ color: 0x888888, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.05;
  group.add(ring);

  const actionLabel = makeLabelSprite(6, 64);
  actionLabel.spr.position.y = 3.1;
  actionLabel.spr.visible = false;
  group.add(actionLabel.spr);

  // 직업 고정 배정 — 워커가 생기는 순서대로 광부/나무꾼/목수를 돌아가며 준다(6명이면 2·2·2).
  // 임시 자식 워커는 몇 초 만에 사라지므로 순번을 소비하지 않는다(균형이 어긋나면 안 된다).
  // ★사령관 지시(2026-08-11) "나무꾼 네이밍 빼, 네이밍은 지금 켜져 있는 터미널 이름으로" —
  //   직업은 내부 배정으로만 쓰고, 머리 위 이름표는 그 워커가 대변하는 **세션(터미널) 제목**을 띄운다.
  const role = isTransient ? null : ROLE_CYCLE[roleSeq++ % ROLE_CYCLE.length];
  // ★사령관 지적(2026-08-11) "우리 캐릭터 여러 개 있는데 지금 몇몇 캐릭터가 없는데?" —
  //   캐릭터를 `hash(jobId) % 5`로 뽑았더니 실측에서 Barbarian 3 · Mage 2 · Ranger 1이 나오고
  //   **Knight와 Rogue는 한 번도 안 나왔다**. 생기는 순서대로 순환 배정해 5종이 다 나오게 한다.
  const charFile = isTransient
    ? CHAR_FILES[Math.floor(Math.random()*CHAR_FILES.length)]
    : CHAR_FILES[charSeq++ % CHAR_FILES.length];

  const idLabel = makeLabelSprite(5, 44); // 폭은 원래대로 — 긴 제목은 drawTextFit이 글자를 줄여 담는다
  idLabel.spr.position.y = 3.8;
  drawTextFit(idLabel, jobId, '#cfd9c2', 20); // 세션 제목이 들어오면 poll에서 갈아끼운다
  group.add(idLabel.spr);

  const barLabel = makeLabelSprite(3.6, 18);
  barLabel.spr.position.y = 3.5;
  group.add(barLabel.spr);

  // NPC 대사 말풍선 — 이름표보다 위에 뜬다
  const chatLabel = makeLabelSprite(6.2, 46);
  chatLabel.spr.position.y = 4.6;
  chatLabel.spr.visible = false;
  group.add(chatLabel.spr);

  const w = {
    jobId, role, charFile, group, placeholder, ring, hitbox, actionLabel, idLabel, barLabel, chatLabel,
    bob: Math.random()*10, mixer: null, model: null, actions: new Map(), idleAction: null,
    curAction: null, holdUntil: 0, transient: !!isTransient,
    // ══ 상태 머신(§3) 단일 필드 — IDLE / TRAVEL / WORK / HAUL / DELIVER
    state: 'IDLE', target: null, waypoint: null, workClip: null, workHold: 2600
  };
  workers.set(isTransient ? (jobId + ':' + Math.random()) : jobId, w);
  return w;
}

async function loadCharacterFor(w){
  const file = w.charFile || CHAR_FILES[hashPos(w.jobId).h % CHAR_FILES.length];
  await clipsReady;
  let g;
  try { g = await load('./assets/characters/' + file); }
  catch (e) { console.warn('[hearthling] char load fail', file, e); return; }
  const m = g.scene;
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  const box = new THREE.Box3().setFromObject(m);
  const sz = new THREE.Vector3(); box.getSize(sz);
  const natH = sz.y || 1;
  m.scale.setScalar(1.5/natH);
  const b2 = new THREE.Box3().setFromObject(m);
  m.position.y -= b2.min.y;

  w.group.remove(w.placeholder);
  w.model = m;
  w.group.add(m);
  // 오른손 슬롯 본 — player.js와 동일하게 KayKit 리그의 `handslotr`를 찾아 도구를 붙일 자리로 쓴다.
  m.traverse(o => { if (o.isBone && o.name === 'handslotr') w.handSlot = o; });
  if (!w.handSlot) console.warn('[hearthling] handslotr 본을 못 찾음 —', file);
  // 모델이 늦게 도착한 사이에 이미 작업이 배정됐다면 지금 연장을 들려준다.
  if (w._wantTool) equipTool(w, w._wantTool);

  w.mixer = new THREE.AnimationMixer(m);
  mixers.push(w.mixer);
  const idleClip = sharedClips.get(IDLE_CLIP);
  if (idleClip) {
    w.idleAction = w.mixer.clipAction(idleClip);
    w.idleAction.play();
    w.curAction = w.idleAction;
  }
}

// ══ 워커 전용 가상 시계 ══
// 자동화 탭은 백그라운드라 rAF가 멈춰 워커가 한 발도 못 움직인다(이번 트랙의 반복 교훈 5).
// 워커 타이머를 전부 이 시계로 통일해두면, 렌더 없이 `__simSteps()`로 상태 머신만 강제로 흘려보내
// "한 사이클 완주"를 검증할 수 있다. 평상시 SIM_OFFSET=0이라 performance.now()와 완전히 동일하다.
let SIM_OFFSET = 0;
const nowMs = () => performance.now() + SIM_OFFSET;

function playCategory(w, clipName, holdMs){
  if (!w.mixer) return; // 캐릭터 아직 로드중이면 애니는 스킵(라벨 팝업은 그대로 뜸)
  const clip = sharedClips.get(clipName) || sharedClips.get(DEFAULT_ANIM);
  if (!clip) return;
  let action = w.actions.get(clip.name);
  if (!action) { action = w.mixer.clipAction(clip); w.actions.set(clip.name, action); }
  action.setLoop(THREE.LoopRepeat, Infinity);
  if (w.curAction && w.curAction !== action) w.curAction.fadeOut(0.15);
  action.reset().fadeIn(0.15).play();
  w.curAction = action;
  w.holdUntil = nowMs() + (holdMs || 1700);
}

function ensureLoopAction(w, clipName){
  if (!w.mixer) return;
  const clip = sharedClips.get(clipName);
  if (!clip) return;
  let action = w.actions.get(clip.name);
  if (!action) { action = w.mixer.clipAction(clip); action.setLoop(THREE.LoopRepeat, Infinity); w.actions.set(clip.name, action); }
  if (w.curAction !== action) {
    if (w.curAction) w.curAction.fadeOut(0.15);
    action.reset().fadeIn(0.15).play();
    w.curAction = action;
  }
}

// 도구 이벤트 → 목적지(광물/나무/제작대/본부)로 이동 시작. 도착 후 실제 도구 애니메이션 재생.
// ★사령관 지적(2026-08-08): "AI가 어떻게 광물을 캐오고 어떤 액션을 하는지 안 나와 있다" —
//   워커가 도착해서 애니메이션만 재생하고 끝이라 "무슨 일을 해서 뭘 만들어내는지"가 안 보였다.
//   도착 시 실제로 캔 광물 이름(예: 철광석)·채집/제작 종류를 "+1 자원명" 팝업으로 명시한다.
const RESOURCE_LABEL = { ore: null /* node.name으로 실제 광종 표시 */, forage: '나무', build: '제작', base: '보고',
  smith: '벼림', saw: '목재', trade: '교역' };
const RESOURCE_COLOR = { ore: '#d8cfa8', forage: '#8fd06a', build: '#f0a860', base: '#7fb8ff',
  smith: '#ff9d5c', saw: '#c8a86a', trade: '#7fb8ff' };
function sendToWork(w, tool){
  const category = categoryFor(w, tool);
  const node = pickNode(category);
  w.target = node;
  w.waypoint = null;
  w._lastDist = null; w._stuckSince = 0; w._flips = 0; w._giveUp = false; // 새 목표 — 진전 감시 초기화
  w.workClip = animForCategory(category, tool);
  w.pendingCategory = category;
  w.workHold = 2600; // 캐는 동작을 충분히 보여준다(예전 1.7초는 도착하자마자 끝나버렸다)
  w.resourceLabel = (category === 'ore' && node.name) ? node.name : (RESOURCE_LABEL[category] || '작업');
  w.resourceColor = RESOURCE_COLOR[category] || '#eaffea';
  // ★사령관 지시(2026-08-10): "에이전트들이 움직이면서 나무 캐고, 돌 캐고, 해오는 모션이 있어야 함" —
  //   채집/채굴은 그 자리에서 끝나는 게 아니라, 캔 것을 들고 건설 현장까지 **가져와서 납품**하는 왕복이 된다.
  w.carryAfter = (category === 'ore' || category === 'forage');
  // ★사령관 지적(2026-08-11) "모루 앞에서 대장간 작업하는 사람 동작 있어야 하지 않나" —
  //   건물 작업장(대장간·제재소·시장·건설현장)은 `carryAfter=false`라 도착 즉시 사이클이 끝나
  //   `TRAVEL>IDLE`만 반복했다(실측). 채집처럼 **WORK 상태를 거쳐 그 자리에서 계속 두드리게** 한다.
  w.craftAfter = (category === 'smith' || category === 'saw' || category === 'trade' || category === 'build');
  if (w.craftAfter) w.workHold = 7000; // 망치질·톱질이 눈에 남을 만큼 유지
  w.state = 'TRAVEL';
  equipTool(w, category); // 연장을 들고 출발한다 — 곡괭이 들고 광산으로, 도끼 들고 숲으로
}

// ★사령관 지적(2026-08-10) "광물 캐는 거 없는데? 벌목도 안 하고" — 진짜 원인은 애니메이션이 아니라 **선점**이었다.
//   활성 세션은 1초에 도구를 여러 번 호출하는데 이벤트마다 sendToWork가 목적지를 즉시 갈아치웠다.
//   워커는 초속 4.5로 걷고 광물까지 20유닛이면 4초 이상 걸리니, 도착 전에 목표가 바뀌어 **영영 도착하지 못하고
//   걷기만 반복**했다(= 캐는 동작·벌목 동작이 한 번도 재생되지 않음). 한 사이클(가서→캐고→지고 와서→납품)은
//   끝까지 마치게 하고, 그 사이 들어온 도구는 큐에 쌓아 다음 사이클로 넘긴다.
function enqueueWork(w, tool){
  w._lastTool = tool; // 에이전트가 계속 일하는 동안 워커가 이어서 돌릴 기준 도구
  if ((!w.state || w.state === 'IDLE') && !w._nextTool){ sendToWork(w, tool); return; }
  w.queue = w.queue || [];
  w.queue.push(tool);
  while (w.queue.length > 2) w.queue.shift(); // 밀린 작업은 최신 2개만 — 오래된 건 버린다
}
// 한 사이클이 끝난 시점에 호출 — 큐에 다음 일이 있으면 잠깐 숨 고른 뒤 이어서 시작한다.
function finishCycle(w){
  w.state = 'IDLE';
  w.target = null;
  w.waypoint = null;
  equipTool(w, null); // 일이 끝나면 연장을 내린다
  w._restUntil = nowMs() + 900; // 한 번 숨 고르고 다음 사이클

  if (w.queue && w.queue.length){
    w._nextTool = w.queue.shift();
    w._nextAt = nowMs() + 500;
  }
}

// ══ 지고 가는 자원 — ★사령관 지적(2026-08-10) "케이킷 에셋 중에 통나무묶음, 돌묶음 이런 거 있을 텐데":
//   처음엔 색만 입힌 정20면체를 들려놨는데 실제로 KayKit_ResourceBits 팩에 통나무 묶음·돌덩이·광종별 너겟이
//   전부 있었다. 실제 게임 `modules/invui.js`의 매핑 규칙을 그대로 따른다 — iron/copper/gold/silver는
//   전용 너겟 모델, 전용 모델이 없는 주석·석탄·코발트는 돌덩이에 틴트(게임도 정확히 그렇게 처리한다).
const RES_BITS = REAL + 'resources/';
const CARRY_MODEL = {
  '나무':   { file:'Wood_Log_Stack' },        // 사령관이 지목한 통나무 묶음
  '제작':   { file:'Wood_Planks_Stack_Small' },
  '돌':     { file:'Stone_Chunks_Large' },
  '철광석': { file:'Iron_Nuggets' },
  '구리':   { file:'Copper_Nuggets' },
  '은':     { file:'Silver_Nuggets' },
  '금':     { file:'Gold_Nuggets' },
  '주석':   { file:'Stone_Chunks_Small', tint:0xa8afb7 }, // invui.js와 동일한 대체 방식
  '석탄':   { file:'Stone_Chunks_Small', tint:0x26282d },
  '코발트': { file:'Stone_Chunks_Small', tint:0x3a63e0 },
  '보석':   { file:'Stone_Chunks_Small', tint:0xd83a5e },
};
const CARRY_FALLBACK = { file:'Stone_Chunks_Small' };
// 손 슬롯 본 밑에서의 배율 — 도구(곡괭이 scale 5)와 같은 좌표계라 그 기준에 맞춘 값.
// (4.2로 시작했다가 통나무가 캐릭터보다 커져서 실렌더 대조 후 축소 — 손 본은 캐릭터 스케일이 이미 곱해져 있다)
const CARRY_HAND_SCALE = 0.72;
const carryProtoCache = new Map(); // file -> Promise<Object3D>
function loadCarryProto(file){
  if (!carryProtoCache.has(file)){
    const gl = new GLTFLoader();
    carryProtoCache.set(file, gl.loadAsync(RES_BITS + file + '.gltf').then(g => {
      const root = g.scene;
      root.traverse(o => { if (o.isMesh){ o.castShadow = true; if (o.material && o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace; } });
      // 캐릭터가 두 손으로 들 만한 크기로 정규화(원본은 팩마다 스케일이 제각각이다)
      const bb = new THREE.Box3().setFromObject(root);
      const sz = new THREE.Vector3(); bb.getSize(sz);
      const s = 0.95 / Math.max(0.001, Math.max(sz.x, sz.y, sz.z));
      root.scale.setScalar(s);
      return root;
    }).catch(e => { console.warn('[hearthling] 자원 모델 로드 실패', file, e); return null; }));
  }
  return carryProtoCache.get(file);
}
// ══ 손에 드는 도구 — ★사령관 "돌 곡괭이로 안 캐는데?": 빈손으로 곡괭이질 모션만 하니 캐는 걸로 안 읽혔다.
//   실제 게임 player.js와 동일한 방식 — KayKit 리그의 `handslotr` 본을 찾아 그 밑에 모델을 붙인다.
//   kenney 모델은 GLB에 텍스처가 없어 공유 colormap을 입혀야 한다(player.js _attach의 kenney 분기와 동일).
let _toolColormap = null;
function toolColormap(){
  if (!_toolColormap){
    _toolColormap = new THREE.TextureLoader().load(TOOL_BASE + 'Textures/colormap.png');
    _toolColormap.flipY = false; _toolColormap.colorSpace = THREE.SRGBColorSpace;
  }
  return _toolColormap;
}
const toolProtoCache = new Map();
function loadToolProto(spec){
  if (!toolProtoCache.has(spec.file)){
    const gl = new GLTFLoader();
    toolProtoCache.set(spec.file, gl.loadAsync(TOOL_BASE + spec.file).then(g => {
      const t = g.scene;
      t.traverse(o => {
        if (!o.isMesh) return;
        o.frustumCulled = false; o.castShadow = true;
        if (spec.kenney){ o.material = o.material.clone(); o.material.map = toolColormap(); o.material.color.set(0xffffff); o.material.needsUpdate = true; }
        else if (o.material && o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
      });
      return t;
    }).catch(e => { console.warn('[hearthling] 도구 모델 로드 실패', spec.file, e); return null; }));
  }
  return toolProtoCache.get(spec.file);
}
function equipTool(w, category){
  // ★버그(2026-08-10): 캐릭터 GLB 로드가 끝나기 전에 첫 작업이 배정되면 `handSlot`(손 본)이 아직 없어
  //   장착이 조용히 실패했다 — 실제 파이프라인에서는 워커가 계속 빈손이었다(강제 호출로 확인했을 땐 보였던 이유).
  //   원하는 카테고리를 기억해뒀다가 모델 로드가 끝나면 그때 장착한다.
  w._wantTool = category || null;
  const spec = CATEGORY_TOOL[category];
  if (!spec){ if (w.toolMesh) w.toolMesh.visible = false; w._toolFile = null; return; }
  if (w._toolFile === spec.file && w.toolMesh){ w.toolMesh.visible = true; return; }
  loadToolProto(spec).then(proto => {
    if (!proto || !w.handSlot || w._wantTool !== category) return;
    if (w.toolMesh) w.handSlot.remove(w.toolMesh);
    const wrap = new THREE.Group();
    wrap.add(proto.clone(true));
    wrap.scale.setScalar(spec.scale || 1);
    wrap.rotation.set(...(spec.rot || [0,0,0]));
    w.handSlot.add(wrap);
    w.toolMesh = wrap; w._toolFile = spec.file;
  });
}
window.__equipTool = (w, c) => equipTool(w, c); // 디버그 훅
window.__setCarrying = (w, on) => setCarrying(w, on); // 디버그 훅(운반물 모델을 바로 들려보고 확인용)
function setCarrying(w, on){
  w.carrying = !!on;
  if (!on){ if (w.carryMesh) w.carryMesh.visible = false; return; }
  const spec = CARRY_MODEL[w.resourceLabel] || CARRY_FALLBACK;
  if (w._carryFile === spec.file && w.carryMesh){ w.carryMesh.visible = true; return; }
  loadCarryProto(spec.file).then(proto => {
    if (!proto || !w.carrying) return;
    if (w.carryMesh && w.carryMesh.parent) w.carryMesh.parent.remove(w.carryMesh);
    const m = proto.clone(true);
    if (spec.tint) m.traverse(o => { if (o.isMesh){ o.material = o.material.clone(); o.material.color.setHex(spec.tint); } });
    // ★사령관 지적(2026-08-10) "가지고 올 때 손으로 가져와야지 머리로 가져옴": 그룹에 직접 붙여 머리 위에
    //   띄워놨었다. 연장과 똑같이 **손 슬롯 본(handslotr)** 에 붙여 손으로 들게 한다(운반 중엔 연장을 내리므로
    //   같은 슬롯을 써도 겹치지 않는다). 본 밑이라 크기는 도구와 같은 배율 기준으로 맞춘다.
    if (w.handSlot){
      m.scale.multiplyScalar(CARRY_HAND_SCALE);
      m.position.set(0, 0, 0);
      w.handSlot.add(m);
    } else {
      m.position.set(0, 1.85, 0.42); // 손 본을 못 찾은 예외 상황 폴백
      w.group.add(m);
    }
    w.carryMesh = m; w._carryFile = spec.file;
  });
}

function ensureWorker(jobId){
  let w = workers.get(jobId);
  if (w) return w;
  w = baseWorker(jobId, false);
  loadCharacterFor(w);
  return w;
}

function spawnTransientChild(parentJobId, clipName){
  const w = baseWorker(parentJobId, true);
  loadCharacterFor(w).then(() => playCategory(w, clipName, 2200));
  drawText(w.actionLabel, '↳ Agent 소환', '#eaffea', 22);
  w.actionLabel.spr.visible = true;
  setTimeout(() => {
    scene.remove(w.group);
    for (const [k, v] of workers) if (v === w) workers.delete(k);
  }, 3200);
}

// ══ NPC 대사 — ★사령관 지시(2026-08-11) ══
// "중간중간마다 게임 대화창처럼 에이전트들이 말하는 거 넣으면 좋겠는데 '아이고~ 힘들어라' 이러면서
//  재밌는 요소로? npc들이 가끔 대화창으로 날리는 것처럼"
// 상황(역할/상태)에 맞는 대사를 머리 위에 잠깐 띄운다. 너무 잦으면 시끄러우니 워커당 간격을 벌린다.
const CHAT = KO ? {
  ore:    ['여기 광맥이 실하네', '곡괭이가 무뎌졌어…', '한 번만 더 치면 되겠다', '어깨야…'],

  forage: ['A thick one, this tree', 'Timber—!', 'Sawdust in my eye', 'Time to sharpen the axe'],
  smith:  ['Strike while the iron is hot', 'Oh, my arms', 'More air on the fire', 'Now that is a fine edge'],

  build:  ['Running low on nails', 'Sun will set on us', 'Keep that post straight', 'Just the roof left!'],
  haul:   ['Phew… heavy work', 'Heavy, so heavy', 'My back is done for', 'Almost there'],
  deliver:['Here you go', 'That is my share for today', 'Next load coming right up'],

};
function sayChat(w, kind){
  const lines = CHAT[kind];
  if (!lines || !w.chatLabel) return;
  const now = nowMs();
  if (now < (w._chatUntil || 0)) return;          // 아직 말하는 중
  if (now < (w._nextChatAt || 0)) return;         // 쉬는 시간
  drawTextFit(w.chatLabel, lines[Math.floor(Math.random()*lines.length)], '#fff6e0', 21);
  w.chatLabel.spr.visible = true;
  w._chatUntil = now + 2800;
  w._nextChatAt = now + 16000 + Math.random()*26000; // 워커마다 16~42초 간격
}
function tickChat(w, now){
  if (w.chatLabel && w.chatLabel.spr.visible && now > (w._chatUntil||0)) w.chatLabel.spr.visible = false;
  // 일이 없을 때도 가끔 한마디 — 멈춰 있는 워커가 죽은 것처럼 보이지 않게
  if (w.state === 'IDLE' && now > (w._nextChatAt||0)){
    sayChat(w, w.jobState === 'blocked' ? 'blocked'
             : (w.jobState === 'done' || w.jobState === 'completed') ? 'done'
             : w.jobState === 'failed' ? 'failed' : 'idle');
  }
}

function pulseLabel(w, text){
  drawText(w.actionLabel, text, '#eaffea', 22);
  w.actionLabel.spr.visible = true;
  w._labelUntil = nowMs() + 1800;
}

// 도착 후 실제로 "뭘 만들어냈는지" 위로 떠오르며 사라지는 팝업 — 툴 이름 라벨과 별개로 결과물을 명시.
const yieldPopups = [];
function spawnYieldPopup(x, y, z, text, color){
  const label = makeLabelSprite(4.6, 42);
  drawText(label, '+1 ' + text, color || '#eaffea', 24);
  label.spr.position.set(x, y, z);
  scene.add(label.spr);
  yieldPopups.push({ spr: label.spr, t: 0, life: 1.5 });
}
function updateYieldPopups(dt){
  for (let i = yieldPopups.length - 1; i >= 0; i--) {
    const p = yieldPopups[i];
    p.t += dt;
    p.spr.position.y += dt * 1.5;
    p.spr.material.opacity = Math.max(0, 1 - p.t / p.life);
    if (p.t >= p.life) { scene.remove(p.spr); p.spr.material.dispose(); yieldPopups.splice(i, 1); }
  }
}

function fmtElapsed(iso){
  if (!iso) return '';
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/1000));
  const m = Math.floor(s/60), r = s%60;
  if (KO) return m > 0 ? `${m}분 ${r}초` : `${r}초`;
  return m > 0 ? `${m}m ${r}s` : `${r}s`;
}

// 모델 ID → 사람이 읽는 이름. `claude-opus-5[1m]`, `claude-sonnet-4-5-20250929`, `gpt-5-codex` 같은
// 실제 값을 짧게 줄인다(머리 위 이름표에 들어가야 해서 길면 안 된다).
function modelLabel(id){
  if (!id) return '에이전트';
  const s = String(id).toLowerCase();
  if (s.includes('opus'))   return 'Opus';
  if (s.includes('sonnet')) return 'Sonnet';
  if (s.includes('haiku'))  return 'Haiku';
  if (s.includes('fable'))  return 'Fable';
  if (s.includes('gpt') || s.includes('codex')) return 'GPT';
  if (s.includes('gemini')) return 'Gemini';
  return String(id).split(/[-_]/)[0] || '에이전트';
}
// ★사령관 질문(2026-08-11) "m은 만 단위인거지? 946만이야 이번주?" — 아니다. M은 **백만**이라
//   946.35M은 946만이 아니라 9억 4,635만이다. k/M/B 표기가 한국어 단위(만/억)와 어긋나서 생긴 오해라
//   표기 자체를 **억/만**으로 바꾼다. 1만=10,000 · 1억=100,000,000.
function fmtTok(n){
  n = Number(n) || 0;
  if (KO){
    if (n >= 1e8) return (n/1e8).toFixed(2) + '억';
    if (n >= 1e6) return (n/1e4).toFixed(0) + '만';
    if (n >= 1e4) return (n/1e4).toFixed(1) + '만';
    return String(n);
  }
  // 영어는 글로벌 표준 K/M/B (억/만 규칙은 한국어 표시 전용)
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e7) return (n/1e6).toFixed(0) + 'M';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n/1e3).toFixed(0) + 'K';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return String(n);
}
// ══ 비용 환산 ══
// Anthropic API 공개 목록가($/100만 토큰, 2026-08 기준). 캐시 생성=입력×1.25, 캐시 읽기=입력×0.1.
// ⚠️ 사령관은 구독으로 쓰므로 실제 청구액이 아니라 "API로 썼다면 얼마" 환산치다.
const MODEL_RATE = {
  Fable:  { in: 10, out: 50 },
  Opus:   { in: 5,  out: 25 },
  Sonnet: { in: 3,  out: 15 },   // 2026-08-31까지 도입가($2/$10) 적용 시 더 낮음
  Haiku:  { in: 1,  out: 5  },
};
function costOf(byModel){
  let usd = 0, unknownTok = 0;
  for (const id in byModel){
    const k = modelLabel(id) === '에이전트' ? '기타' : modelLabel(id);
    const r = MODEL_RATE[k];
    const s = byModel[id];
    if (!r){ unknownTok += (s.in||0)+(s.out||0)+(s.cw||0)+(s.cr||0); continue; }
    usd += ((s.in||0)*r.in + (s.out||0)*r.out + (s.cw||0)*r.in*1.25 + (s.cr||0)*r.in*0.1) / 1e6;
  }
  return { usd, unknownTok };
}
function fmtUsd(v){
  if (v >= 1000) return '$' + v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (v >= 1) return '$' + v.toFixed(2);
  return '$' + v.toFixed(3);
}

  const w = workers.get(jobId);
  const role = w && w.role ? ROLE_NAME[w.role] : null;
  feedRows.unshift({ who: who + (role ? ' · ' + role : ''), what: tool + (detail ? ' — ' + detail.slice(0, 52) : '') });
  while (feedRows.length > FEED_MAX) feedRows.pop();
  document.getElementById('feed').innerHTML = feedRows.map(r =>
    `<div class="row"><i class="dot"></i><span class="who">${escapeHtml(r.who)}</span><span class="what">${escapeHtml(r.what)}</span></div>`

}

let lastEventId = 0;
let latestJobs = [];

async function poll(){
  try {
    const [jr, er] = await Promise.all([
      fetch('/api/jobs').then(r=>r.json()),
      fetch('/api/events?after=' + lastEventId).then(r=>r.json())
    ]);
    latestJobs = jr.jobs;
    updateBuildSite(jr.jobs);
    document.getElementById('emptyHint').classList.toggle('show', jr.jobs.length === 0);

    // 상단 요약 — 카드 나열 대신 "몇 개가 돌고 있는지"만
    document.getElementById('stActive').textContent = jr.jobs.filter(j => j.state === 'active').length;
    if (popJobId) { const p = document.getElementById('pop'); showPop(popJobId, parseFloat(p.style.left)+p.offsetWidth/2, parseFloat(p.style.top)+p.offsetHeight+16); }

    for (const j of jr.jobs){
      const w = ensureWorker(j.jobId);
      const color = STATE_COLOR[j.state] ?? 0x777777;
      w.ring.material.color.setHex(color);
      if (w.placeholder) w.placeholder.material.color.setHex(color);
      const ratio = Math.min(1, (j.tokens||0) / 50000);
      drawBar(w.barLabel, ratio, '#7fbf6a');
      // 에이전트가 실제로 돌고 있는지 — 워커는 이 상태일 때만 쉬지 않고 일한다.
      w.jobState = j.state;
      // ★사령관 지시(2026-08-11) "에이전트 이름은 각각의 모델명, 소넷이나 오퍼스, gpt면 gpt 에이전트,
      //   그리고 토큰양이 보여야 할 듯" — 머리 위 이름표를 세션 제목에서 **모델명 + 누적 토큰**으로 교체.
      const shown = disp(modelLabel(j.model)) + ' · ' + fmtTok(j.tokens || 0);
      if (w._labelName !== shown){ w._labelName = shown; drawTextFit(w.idLabel, shown, '#cfd9c2', 20); }
    }

    for (const ev of er.events){
      const w = ensureWorker(ev.jobId);
      enqueueWork(w, ev.tool); // 진행 중인 사이클을 끊지 않고 큐로 넘긴다(끊으면 영영 도착을 못 한다)
      pulseLabel(w, ev.tool + (ev.detail ? (': ' + ev.detail.slice(0,26)) : ''));
      if (ev.tool === 'Agent' || ev.tool === 'Task') spawnTransientChild(ev.jobId, 'Interact');
      pushFeed(ev.jobId, ev.tool, ev.detail);
    }
    if (er.latestId) lastEventId = er.latestId;
  } catch(e){ /* 서버 재시작 등 일시 실패는 다음 폴링에서 회복 */ }
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 경량 마크다운: 코드펜스 → <pre>, 인라인 `code` → <code>, **굵게** → <b>. 표/헤더 등은 일부러 안 건드림(줄바꿈 그대로 pre-wrap로 충분히 읽힘).
function mdLite(raw){
  const parts = (raw||'').split(/```/);
  return parts.map((chunk, i) => {
    if (i % 2 === 1) return `<pre>${escapeHtml(chunk.replace(/^\w*\n/, ''))}</pre>`;
    return escapeHtml(chunk).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }).join('');
}
function relTime(iso){
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  const m = Math.floor(ms/60000);
  if (m < 1) return KO ? '방금' : 'just now';
  if (m < 60) return KO ? m + '분 전' : m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return KO ? h + '시간 전' : h + 'h ago';
  const d = Math.floor(h/24); return KO ? d + '일 전' : d + 'd ago';
}
const ST_LABEL = KO
  ? { active:'진행중', blocked:'대기', failed:'실패', done:'완료', completed:'완료', queued:'대기열' }
  : { active:'active', blocked:'waiting', failed:'failed', done:'done', completed:'done', queued:'queued' };

// ══ 워커 클릭 → 말풍선 ══ (사령관 컨펌: "워커 클릭 → 말풍선으로")
// 화면 전체가 게임이므로 캔버스 클릭을 레이캐스트해서 어떤 워커를 눌렀는지 찾는다.
// ★두 가지를 같이 해결한다:
//   ① 드래그(카메라 회전)와 클릭 구분 — pointerdown에서 바로 열면 회전할 때마다 팝업이 뜬다.
//   ② OrbitControls가 같은 캔버스의 pointerdown을 먼저 잡고 setPointerCapture 예외를 던지면
//      뒤에 등록된 리스너가 실행되지 않는다(실측: 합성 이벤트에서 팝업이 한 번도 안 열렸다).
//      **capture 단계**에 등록해 OrbitControls보다 먼저 받는다.
const _ray = new THREE.Raycaster(), _pt = new THREE.Vector2();
let _downX = 0, _downY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { _downX = e.clientX; _downY = e.clientY; }, { capture: true });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - _downX, e.clientY - _downY) > 6) return; // 드래그 = 카메라 회전이므로 무시
  _pt.x = (e.clientX / innerWidth) * 2 - 1;
  _pt.y = -(e.clientY / innerHeight) * 2 + 1;
  _ray.setFromCamera(_pt, camera);
  let best = null, bestDist = Infinity;
  for (const [, w] of workers){
    if (!w.hitbox || w.transient) continue;
    const hits = _ray.intersectObject(w.hitbox, false);
    if (hits.length && hits[0].distance < bestDist){ bestDist = hits[0].distance; best = w; }
  }
  if (best) showPop(best.jobId, e.clientX, e.clientY);
  else hidePop();
}, { capture: true });
window.__clickReady = true;              // 리스너 등록 확인용
window.__pickAt = (x, y) => {            // 합성 이벤트 없이 픽 로직만 직접 검증
  _pt.x = (x / innerWidth) * 2 - 1; _pt.y = -(y / innerHeight) * 2 + 1;
  _ray.setFromCamera(_pt, camera);
  let best = null, bd = Infinity;
  for (const [, w] of workers){
    if (!w.hitbox || w.transient) continue;
    const h = _ray.intersectObject(w.hitbox, false);
    if (h.length && h[0].distance < bd){ bd = h[0].distance; best = w; }
  }
  if (best) showPop(best.jobId, x, y); else hidePop();
  return best ? best.jobId : null;
};

// ══ 토큰 사용량(일별·주별) ══
// ★사령관 지시(2026-08-11) "내가 일별로 주별로 얼마나 에이전트 토큰을 썼는지 알 수 있으면 좋을 듯".
// 서버가 `~/.claude/projects`의 트랜스크립트 전체를 증분 인덱싱해서 날짜별·모델별 합계를 내려준다.
// 여기서는 모델별 색으로 쌓은 가로 막대로 보여준다(같은 날 오퍼스/소넷을 얼마씩 썼는지 한눈에).
const MODEL_COLOR = { Opus:'#c48cf0', Sonnet:'#6fb7f5', Haiku:'#68d3a7', Fable:'#f0b45c', GPT:'#7de08a', Gemini:'#f07c9b', 기타:'#8d99a6' };
// ★사령관 질문(2026-08-11) "이거 토큰 사용량이 진짜 맞는 수치?" — 값은 트랜스크립트와 정확히 일치했지만
//   **지표가 틀렸다**. 실측 구성비: 캐시 읽기 98.35% · 캐시 생성 1.31% · 출력 0.33% · 입력 0.01%.
//   즉 "오늘 276M"은 사실상 캐시 재사용량 총합이라 실제로 쓴 양과 무관했다.
//   주 수치를 **신규 처리 토큰(입력 + 출력 + 캐시 생성)** 으로 바꾸고, 캐시 읽기는 따로 보여준다.
// ★사령관 지시(2026-08-11) "실제 토큰양으로 해줘" — 주 수치를 **실제로 오간 전량**으로 되돌린다.
//   (직전에 캐시 읽기 98%가 실사용을 가린다고 판단해 신규 처리분만 보여줬는데, 임의로 빼지 말라는 지시)
//   대신 내역(입력/출력/캐시 생성/캐시 읽기)을 하단에 그대로 병기해 구성이 보이게 한다.
// ★사령관 지적(2026-08-11) "억이 말도 안 되는데?" — 막대에 **캐시 읽기**를 넣었던 게 원인이다.
//   캐시 읽기는 대화가 길어질수록 매 요청이 이전 대화 전체를 다시 읽는 누적치라(실측: 한 세션 하루
//   818회 × 38.6만) 총량이 억 단위로 부풀어 실제 작업량과 무관해진다. 주별 최대 총량 129억 vs
//   같은 주 생성 3,888만 — 후자가 사령관 체감과 맞는다.
//   그래서 **막대·행 수치는 생성(출력) 토큰**으로 잡고, 총량·캐시는 아래에 참고로만 둔다.
function sumRow(byModel){
  let all = 0, cr = 0, cw = 0, out = 0, inp = 0; const per = {};
  for (const id in byModel){
    const s = byModel[id];
    const k = modelLabel(id) === '에이전트' ? '기타' : modelLabel(id);
    per[k] = (per[k]||0) + (s.out||0);           // 막대 구간도 생성 기준
    out += (s.out||0); cr += (s.cr||0); cw += (s.cw||0); inp += (s.in||0);
    all += (s.in||0) + (s.out||0) + (s.cw||0) + (s.cr||0);
  }
  return { total:out, per, all, cache:cr, cacheWrite:cw, out, in:inp };
}
function usageRows(rows, key, maxTotal, todayKey){
  return rows.map(r => {
    const { total, per } = sumRow(r.byModel);
    const w = maxTotal ? (total/maxTotal*100) : 0;
    const segs = Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([m,v]) =>
      `<i style="width:${(v/Math.max(1,total)*100).toFixed(1)}%;background:${MODEL_COLOR[m]||MODEL_COLOR.기타}" title="${disp(m)} ${fmtTok(v)}"></i>`).join('');
    const label = key === 'week' ? (r.week.slice(5).replace('-','/') + (KO ? ' 주' : ' wk')) : r.date.slice(5).replace('-','/');
    const isToday = key !== 'week' && r.date === todayKey;
    return `<div class="row${isToday?' today':''}"><div class="lb">${label}</div>
      <div class="track" style="width:${Math.max(2,w).toFixed(1)}%">${segs}</div>
      <div class="vl">${fmtTok(total)}</div></div>`;
  }).join('');
}
